name: CI

on:
  pull_request:

jobs:
  test-primitives:
    uses: ./.github/workflows/primitives-smoke.yml
    permissions:
      contents: read

  check-readme:
    uses: ./.github/workflows/check-readme.yaml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  check-skills:
    uses: ./.github/workflows/check-skills.yaml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  check-toolchain:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@photon-hq"
      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint JavaScript
        run: npm run lint
      - name: Check formatting
        run: npm run fmt:check

  test-release-workflows:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Test release and image publishing without registry access
        run: |
          npm ci --prefix .github/blocks/check-production-dependencies --ignore-scripts --no-audit --no-fund
          npm ci --prefix .github/package-release --ignore-scripts --no-audit --no-fund
          node --test test/*.test.mjs .github/blocks/check-production-dependencies/*.test.mjs
          python3 -m venv "$RUNNER_TEMP/tests"
          "$RUNNER_TEMP/tests/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/tests/bin/python" -m unittest discover -s test
