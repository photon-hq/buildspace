name: CI

on:
  pull_request:

jobs:
  check-readme:
    uses: ./.github/workflows/check-readme.yaml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  check-skills:
    uses: ./.github/workflows/check-skills.yaml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  test-release-workflows:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test release and image publishing without registry access
        run: |
          node --test test/*.test.mjs
          python3 -m venv "$RUNNER_TEMP/tests"
          "$RUNNER_TEMP/tests/bin/pip" install PyYAML==6.0.3
          "$RUNNER_TEMP/tests/bin/python" -m unittest discover -s test
