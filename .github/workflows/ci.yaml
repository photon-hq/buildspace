name: CI

on:
  pull_request:

jobs:
  check-readme:
    uses: ./.github/workflows/check-readme.yaml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  check-skills:
    uses: ./.github/workflows/check-skills.yaml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
