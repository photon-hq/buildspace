# Reusable workflow: Update Documentation on Release
#
# Analyzes release changes using Claude Code and submits a PR
# to update documentation in the target docs repository.
#
# All repos under photon-hq inherit the org-level APP_ID,
# APP_PRIVATE_KEY, and ANTHROPIC_API_KEY secrets automatically.
#
# Usage (from another repository):
#
#   name: Update Docs on Release
#   on:
#     release:
#       types: [published]
#   jobs:
#     update-docs:
#       uses: photon-hq/buildspace/.github/workflows/update-docs.yaml@main
#       with:
#         # service-name: my-service  # optional, defaults to repo name
#         docs-path: advanced-kits/imessage
#       secrets: inherit

name: Update Documentation

on:
  workflow_call:
    inputs:
      service-name:
        type: string
        required: false
        default: '${{ github.event.repository.name }}'
        description: "Name of the service being released (defaults to repository name)"
      docs-repo:
        type: string
        required: false
        default: 'photon-hq/docs'
        description: "Target documentation repository"
      docs-branch:
        type: string
        required: false
        default: 'main'
        description: "Base branch of the docs repo"
      docs-path:
        type: string
        required: true
        description: "Path within the docs repo that this service maps to (e.g., 'legacy/imessage.mdx' or 'advanced-kits/imessage')"
    secrets:
      ANTHROPIC_API_KEY:
        required: true
        description: "Anthropic API key for Claude Code (org secret)"
      APP_ID:
        required: true
        description: "GitHub App ID for creating PRs on the docs repo (org secret)"
      APP_PRIVATE_KEY:
        required: true
        description: "GitHub App private key (org secret)"

jobs:
  gather-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-info.outputs.version }}
      release_tag: ${{ steps.release-info.outputs.release_tag }}
      release_notes: ${{ steps.release-info.outputs.release_notes }}
      changes_diff: ${{ steps.release-info.outputs.changes_diff }}
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract release info
        id: release-info
        shell: bash
        env:
          RAW_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          # --- Validate release context ---
          if [ -z "${RAW_TAG}" ]; then
            echo "::error::github.event.release.tag_name is empty. This workflow must be triggered by a release event."
            exit 1
          fi

          VERSION="${RAW_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"

          # --- Previous tag & diff ---
          PREVIOUS_TAG=""
          FOUND_CURRENT=false
          while IFS= read -r tag; do
            if [ "${FOUND_CURRENT}" = true ]; then
              PREVIOUS_TAG="${tag}"
              break
            fi
            if [ "${tag}" = "${RAW_TAG}" ]; then
              FOUND_CURRENT=true
            fi
          done < <(git tag --sort=-creatordate)

          if [ "${FOUND_CURRENT}" = false ]; then
            echo "::error::Tag '${RAW_TAG}' not found in the repository. Ensure fetch-depth: 0 includes all tags."
            exit 1
          fi

          if [ -n "${PREVIOUS_TAG}" ]; then
            echo "Generating diff between ${PREVIOUS_TAG} and ${RAW_TAG}"
            DIFF=$(git diff "${PREVIOUS_TAG}..${RAW_TAG}")
          else
            echo "No previous tag found — generating diff from root"
            DIFF=$(git diff 4b825dc642cb6eb9a060e54bf899d69f82cf7258..HEAD)
          fi

          # Use Python to safely write multi-line values to GITHUB_OUTPUT
          # This avoids heredoc delimiter collisions with arbitrary release notes and diffs
          export DIFF
          python3 << 'PYEOF'
          import os, uuid

          output_file = os.environ["GITHUB_OUTPUT"]
          release_body = os.environ.get("RELEASE_BODY", "")
          diff = os.environ.get("DIFF", "")

          # Truncate diff to ~100 000 characters
          max_chars = 100000
          if len(diff) > max_chars:
              diff = diff[:max_chars] + "\n\n... [diff truncated at 100000 characters]"

          def write_multiline(fh, key, value):
              delim = f"GHDELIM_{uuid.uuid4().hex}"
              fh.write(f"{key}<<{delim}\n")
              fh.write(value)
              if value and not value.endswith("\n"):
                  fh.write("\n")
              fh.write(f"{delim}\n")

          with open(output_file, "a") as fh:
              write_multiline(fh, "release_notes", release_body)
              write_multiline(fh, "changes_diff", diff)
          PYEOF

  update-docs:
    needs: gather-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # --- Generate a cross-repo token from the org-level GitHub App secrets ---
      - name: Parse docs repo owner and name
        id: parse-repo
        shell: bash
        run: |
          DOCS_REPO="${{ inputs.docs-repo }}"
          echo "owner=${DOCS_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${DOCS_REPO##*/}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.parse-repo.outputs.owner }}
          repositories: ${{ steps.parse-repo.outputs.name }}

      # --- Run the update-docs block with the generated token ---
      - name: Update Documentation
        id: update-docs
        uses: photon-hq/buildspace/.github/blocks/update-docs@main
        with:
          service-name: ${{ inputs.service-name }}
          version: ${{ needs.gather-changes.outputs.version }}
          release-notes: ${{ needs.gather-changes.outputs.release_notes }}
          changes-diff: ${{ needs.gather-changes.outputs.changes_diff }}
          docs-repo: ${{ inputs.docs-repo }}
          docs-branch: ${{ inputs.docs-branch }}
          docs-path: ${{ inputs.docs-path }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          release-tag: ${{ needs.gather-changes.outputs.release_tag }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Summary
        shell: bash
        run: |
          PR_URL="${{ steps.update-docs.outputs.pr-url }}"
          if [ -n "${PR_URL}" ]; then
            echo "### ✅ Documentation PR Created" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A pull request to update documentation for **${{ inputs.service-name }}** v${{ needs.gather-changes.outputs.version }} has been created:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "🔗 [${PR_URL}](${PR_URL})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ℹ️ No Documentation PR Created" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The update-docs block did not produce a PR for **${{ inputs.service-name }}** v${{ needs.gather-changes.outputs.version }}. This may mean no documentation changes were needed." >> "$GITHUB_STEP_SUMMARY"
          fi