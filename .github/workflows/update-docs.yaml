# Reusable workflow: Update Documentation on Release
#
# Analyzes release changes using Claude Code and submits a PR
# to update documentation in the target docs repository.
#
# All repos under photon-hq inherit the org-level APP_ID,
# APP_PRIVATE_KEY, and ANTHROPIC_API_KEY secrets automatically.
#
# Usage (from another repository):
#
#   name: Update Docs on Release
#   on:
#     release:
#       types: [published]
#   jobs:
#     update-docs:
#       uses: photon-hq/buildspace/.github/workflows/update-docs.yaml@main
#       with:
#         # service-name: my-service  # optional, defaults to repo name
#         docs-path: advanced-kits/imessage
#       secrets: inherit

name: Update Documentation

on:
  workflow_call:
    inputs:
      service-name:
        type: string
        required: false
        default: '${{ github.event.repository.name }}'
        description: "Name of the service being released (defaults to repository name)"
      docs-repo:
        type: string
        required: false
        default: 'photon-hq/docs'
        description: "Target documentation repository"
      docs-branch:
        type: string
        required: false
        default: 'main'
        description: "Base branch of the docs repo"
      docs-path:
        type: string
        required: true
        description: "Documentation focus hint; existing target-repository rules determine edit scope and page placement"
      use-blacksmith:
        type: boolean
        required: false
        default: false
        description: "Opt in to Blacksmith Linux runners (blacksmith-4vcpu-ubuntu-2404). Requires the Blacksmith GitHub App installed on the caller org. Defaults to ubuntu-latest."
    secrets:
      ANTHROPIC_API_KEY:
        required: true
        description: "Anthropic API key for Claude Code (org secret)"
      APP_ID:
        required: true
        description: "GitHub App ID for creating PRs on the docs repo (org secret)"
      APP_PRIVATE_KEY:
        required: true
        description: "GitHub App private key (org secret)"

jobs:
  gather-changes:
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.context.outputs.version }}
      release_tag: ${{ steps.context.outputs.release_tag }}
      release_notes: ${{ steps.context.outputs.release_notes }}
      changes_diff: ${{ steps.context.outputs.changes_diff }}
      reviewers: ${{ steps.context.outputs.reviewers }}
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect release context
        id: context
        uses: photon-hq/buildspace/.github/blocks/collect-release-context@17427ad22755196c02ae80a9caac69a256c1932d
        with:
          release-tag: ${{ github.event.release.tag_name }}
          release-notes: ${{ github.event.release.body }}

  update-docs:
    needs: gather-changes
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      # --- Generate a cross-repo token from the org-level GitHub App secrets ---
      - name: Parse docs repo owner and name
        id: parse-repo
        shell: bash
        run: |
          DOCS_REPO="${{ inputs.docs-repo }}"
          echo "owner=${DOCS_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${DOCS_REPO##*/}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.parse-repo.outputs.owner }}
          repositories: ${{ steps.parse-repo.outputs.name }}

      # --- Run the update-docs block with the generated token ---
      - name: Update Documentation
        id: update-docs
        uses: photon-hq/buildspace/.github/blocks/update-docs@37b405dc100a6559937e5f623b3b598f1b8f7c25
        with:
          service-name: ${{ inputs.service-name }}
          version: ${{ needs.gather-changes.outputs.version }}
          release-notes: ${{ needs.gather-changes.outputs.release_notes }}
          changes-diff: ${{ needs.gather-changes.outputs.changes_diff }}
          docs-repo: ${{ inputs.docs-repo }}
          docs-branch: ${{ inputs.docs-branch }}
          docs-path: ${{ inputs.docs-path }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          release-tag: ${{ needs.gather-changes.outputs.release_tag }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Request reviewers from source repo CODEOWNERS
        if: steps.update-docs.outputs.pr-url != '' && needs.gather-changes.outputs.reviewers != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DOCS_REPO: ${{ inputs.docs-repo }}
          PR_URL: ${{ steps.update-docs.outputs.pr-url }}
          REVIEWERS: ${{ needs.gather-changes.outputs.reviewers }}
        run: |
          # Extract PR number from URL
          PR_NUMBER="$(echo "${PR_URL}" | grep -oE '[0-9]+$')"
          if [ -z "${PR_NUMBER}" ]; then
            echo "Could not extract PR number from ${PR_URL}"
            exit 0
          fi

          IFS=',' read -ra REVIEWER_LIST <<< "${REVIEWERS}"
          REVIEWER_FLAGS=""
          for r in "${REVIEWER_LIST[@]}"; do
            r="$(echo "${r}" | xargs)"
            if [ -n "${r}" ]; then
              REVIEWER_FLAGS="${REVIEWER_FLAGS} --add-reviewer ${r}"
            fi
          done

          if [ -n "${REVIEWER_FLAGS}" ]; then
            gh pr edit "${PR_NUMBER}" --repo "${DOCS_REPO}" ${REVIEWER_FLAGS} || true
          fi

      - name: Summary
        shell: bash
        run: |
          PR_URL="${{ steps.update-docs.outputs.pr-url }}"
          if [ -n "${PR_URL}" ]; then
            echo "### ✅ Documentation PR Created" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A pull request to update documentation for **${{ inputs.service-name }}** v${{ needs.gather-changes.outputs.version }} has been created:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "🔗 [${PR_URL}](${PR_URL})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ℹ️ No Documentation PR Created" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The update-docs block did not produce a PR for **${{ inputs.service-name }}** v${{ needs.gather-changes.outputs.version }}. This may mean no documentation changes were needed." >> "$GITHUB_STEP_SUMMARY"
          fi
