name: Stage npm packages

on:
  workflow_call:
    inputs:
      pack:
        description: Script that packs the caller's packages into $PACK_DESTINATION at version <package.json version>$RELEASE_SUFFIX
        required: true
        type: string
      verify:
        description: Script run once before packing, after dependencies are installed
        default: ''
        type: string
      install:
        default: pnpm install --frozen-lockfile
        type: string
      ci-workflow:
        description: Workflow file (for example ci.yml) whose push run on this exact commit must succeed first
        default: ''
        type: string
      ci-wait-minutes:
        default: 20
        type: number
      package:
        description: Package whose version names the build; defaults to @<owner>/<repository>
        default: ''
        type: string
      tag-prefix:
        description: Staging release tag prefix; defaults to <repository>-staging-
        default: ''
        type: string
      node-version:
        default: '24'
        type: string
      environment:
        default: staging
        type: string
      downstream:
        description: Space-separated repositories of the same owner to notify after publishing
        default: ''
        type: string
      dry-run:
        description: Verify and pack only; the only mode allowed outside main
        default: false
        type: boolean
    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
    outputs:
      staging-version:
        value: ${{ jobs.build.outputs.staging-version }}
      production-version:
        value: ${{ jobs.build.outputs.production-version }}

permissions:
  contents: read

jobs:
  # Runs the caller's code. It can read packages but write nothing.
  build:
    if: github.ref == 'refs/heads/main' || inputs.dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      staging-version: ${{ steps.collect.outputs.staging-version }}
      production-version: ${{ steps.collect.outputs.production-version }}
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch the release tools of this workflow's commit
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init -q "$RUNNER_TEMP/buildspace"
          git -C "$RUNNER_TEMP/buildspace" fetch -q --depth 1 "https://github.com/$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA"
          git -C "$RUNNER_TEMP/buildspace" checkout -q FETCH_HEAD
          npm ci --prefix "$RUNNER_TEMP/buildspace/.github/npm-release" --ignore-scripts --no-audit --no-fund
          echo "RELEASE_TOOLS=$RUNNER_TEMP/buildspace/.github/npm-release" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require CI to pass on this exact commit
        if: inputs.ci-workflow != '' && !inputs.dry-run
        env:
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          CI_WAIT_MINUTES: ${{ inputs.ci-wait-minutes }}
        run: node "$RELEASE_TOOLS/npm-release.mjs" wait-ci --workflow "$CI_WORKFLOW" --timeout-minutes "$CI_WAIT_MINUTES"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # No dependency cache: a release installs from the lockfile alone.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'
      - name: Install
        env:
          INSTALL: ${{ inputs.install }}
        run: bash -euo pipefail -c "$INSTALL"
      - name: Verify
        if: inputs.verify != ''
        env:
          VERIFY: ${{ inputs.verify }}
        run: bash -euo pipefail -c "$VERIFY"
      # Both packs come from the same checkout; neither may change tracked files.
      - name: Pack the staging build and its production candidate
        env:
          PACK: ${{ inputs.pack }}
          STAGING_SUFFIX: -staging.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          for channel in staging production; do
            suffix=""
            if [[ "$channel" == staging ]]; then suffix="$STAGING_SUFFIX"; fi
            mkdir -p "$RUNNER_TEMP/pack/$channel"
            RELEASE_CHANNEL="$channel" RELEASE_SUFFIX="$suffix" PACK_DESTINATION="$RUNNER_TEMP/pack/$channel" \
              bash -euo pipefail -c "$PACK"
            if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
              git status --short --untracked-files=no >&2
              echo "::error::The pack script changed tracked files; restore them before it exits" >&2
              exit 1
            fi
          done
      - name: Collect
        id: collect
        env:
          PACKAGE: ${{ inputs.package }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          STAGING_SUFFIX: -staging.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          node "$RELEASE_TOOLS/npm-release.mjs" collect \
            --staging "$RUNNER_TEMP/pack/staging" --production "$RUNNER_TEMP/pack/production" \
            --suffix "$STAGING_SUFFIX" --package "$PACKAGE" --tag-prefix "$TAG_PREFIX" \
            --output "$RUNNER_TEMP/npm-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          retention-days: 7

  # Never runs the caller's code: it attests and publishes the build job's files.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && !inputs.dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    concurrency:
      group: npm-staging-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch the release tools of this workflow's commit
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init -q "$RUNNER_TEMP/buildspace"
          git -C "$RUNNER_TEMP/buildspace" fetch -q --depth 1 "https://github.com/$WORKFLOW_REPOSITORY" "$WORKFLOW_SHA"
          git -C "$RUNNER_TEMP/buildspace" checkout -q FETCH_HEAD
          npm ci --prefix "$RUNNER_TEMP/buildspace/.github/npm-release" --ignore-scripts --no-audit --no-fund
          echo "RELEASE_TOOLS=$RUNNER_TEMP/buildspace/.github/npm-release" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release
      # Promotion verifies this attestation before publishing a candidate.
      - name: Attest every packed file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/npm-release/*.tgz
      - name: Publish the staging build and attach its candidates
        run: node "$RELEASE_TOOLS/npm-release.mjs" publish --channel staging --directory "$RUNNER_TEMP/npm-release"

  notify-downstream:
    needs: publish
    if: inputs.downstream != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions: {}
    steps:
      - name: List downstream repositories
        id: downstream
        env:
          DOWNSTREAM: ${{ inputs.downstream }}
        run: echo "repositories=$(echo $DOWNSTREAM | tr ' ' ',')" >> "$GITHUB_OUTPUT"
      - name: Mint dispatch token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.downstream.outputs.repositories }}
          permission-contents: write
          permission-metadata: read
      - name: Ask downstream repositories to check for updates
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DOWNSTREAM: ${{ inputs.downstream }}
        run: |
          failed=0
          for repo in $DOWNSTREAM; do
            gh api "repos/$GITHUB_REPOSITORY_OWNER/$repo/dispatches" --method POST \
              -f event_type=internal-package-published \
              -f "client_payload[source]=$GITHUB_REPOSITORY" \
              -f "client_payload[sha]=$GITHUB_SHA" || failed=1
          done
          exit "$failed"
