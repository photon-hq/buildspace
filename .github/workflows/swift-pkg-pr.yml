name: Swift Package PR Build

on:
  workflow_call:
    inputs:
      package-name:
        type: string
        required: true
        description: "Name of the Swift binary / package"
      identifier:
        type: string
        required: true
        description: "Package identifier (e.g. com.example.mytool)"
      scripts-path:
        type: string
        required: false
        description: "Path to scripts directory containing preinstall/postinstall scripts"
      payload-path:
        type: string
        required: false
        description: "Path to additional payload directory whose contents mirror the install root"
      resource-bundles:
        type: string
        required: false
        default: ""
        description: "Space-separated list of SPM resource bundle names to include in the .pkg"
      entitlements:
        type: string
        required: false
        default: ""
        description: "Path to an entitlements plist for ad-hoc codesigning the built binary."
      private-dep-repos:
        type: string
        required: false
        default: ""
        description: "Comma-separated repo names (same owner) of private/internal SPM dependencies. When set, an app token is minted (APP_ID/APP_PRIVATE_KEY) so SwiftPM can clone them."
    secrets:
      SECRET_ENV_VARS:
        required: false

# Cancel any in-progress run for the same PR when a new commit is pushed.
concurrency:
  group: swift-pkg-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      pull-requests: write
      contents: read
    steps:
      # ── Notify: build started ────────────────────────────────────────────
      - name: Comment — build started
        uses: photon-hq/buildspace/.github/blocks/comment-on-pr@main
        with:
          comment-key: swift-pkg-pr-build
          message: |
            ## Swift Package Build

            | | |
            |---|---|
            | **Status** | ⏳ Building… |
            | **Commit** | ${{ github.sha }} |
            | **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

      # ── Mint app token for private SPM dependencies (optional) ───────────
      - name: Mint app token for private SPM deps
        id: app-token
        if: inputs.private-dep-repos != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.private-dep-repos }}

      # ── Build ────────────────────────────────────────────────────────────
      - name: Swift Build
        id: build
        uses: photon-hq/buildspace/.github/blocks/swift-build@test-codesign
        with:
          binary-name: ${{ inputs.package-name }}
          entitlements: ${{ inputs.entitlements }}
          github-token: ${{ steps.app-token.outputs.token }}
          compile-env: |-
            VERSION=PR-${{ github.event.pull_request.number }}
            DEPLOYMENT_ENVIRONMENT=development
            ${{ secrets.SECRET_ENV_VARS }}
          resource-bundles: ${{ inputs.resource-bundles }}

      - name: Swift Package
        uses: photon-hq/buildspace/.github/blocks/swift-pkg@main
        with:
          swift-binary-path: ${{ steps.build.outputs.binary-path }}
          package-name: ${{ inputs.package-name }}
          identifier: ${{ inputs.identifier }}
          version: pr.${{ github.event.pull_request.number }}.${{ github.run_number }}
          scripts-path: ${{ inputs.scripts-path }}
          payload-path: ${{ inputs.payload-path }}
          resource-bundles-path: ${{ steps.build.outputs.resource-bundles-path }}

      # ── Upload artifact ──────────────────────────────────────────────────
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package-name }}-pr${{ github.event.pull_request.number }}-${{ github.sha }}
          path: artifacts/*.pkg
          retention-days: 7

      # ── Notify: success ──────────────────────────────────────────────────
      - name: Comment — build succeeded
        if: success()
        uses: photon-hq/buildspace/.github/blocks/comment-on-pr@main
        with:
          comment-key: swift-pkg-pr-build
          message: |
            ## Swift Package Build

            | | |
            |---|---|
            | **Status** | ✅ Success |
            | **Commit** | ${{ github.sha }} |
            | **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | **Artifact** | `${{ inputs.package-name }}-pr${{ github.event.pull_request.number }}-${{ github.sha }}` (expires in 7 days) |

            Download the `.pkg` from the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) artifacts section.

      # ── Notify: failure ──────────────────────────────────────────────────
      - name: Comment — build failed
        if: failure()
        uses: photon-hq/buildspace/.github/blocks/comment-on-pr@main
        with:
          comment-key: swift-pkg-pr-build
          message: |
            ## Swift Package Build

            | | |
            |---|---|
            | **Status** | ❌ Failed |
            | **Commit** | ${{ github.sha }} |
            | **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            Check the [logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
