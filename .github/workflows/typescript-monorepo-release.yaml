name: TypeScript Monorepo Release

on:
  workflow_call:
    inputs:
      service-name:
        type: string
        required: true
        description: "Display name for the monorepo (used in release title)"
      packages:
        type: string
        required: true
        description: 'JSON array of packages, e.g. [{"name":"photon","path":"packages/photon"},{"name":"@photon/openai-compatible","path":"packages/openai-compatible"}]'
      bun-version:
        type: string
        required: false
        default: "latest"
        description: "Bun version to use"
      npm-tag:
        type: string
        required: false
        default: "latest"
        description: "NPM tag to publish with"
      build-command:
        type: string
        required: false
        default: "bun run build"
        description: "Build command to run in each package directory (ignored if root-build-command is set)"
      root-build-command:
        type: string
        required: false
        default: ""
        description: "Build command to run once at repo root (e.g., 'turbo build'). Takes precedence over per-package build-command."
      include-dependents:
        type: boolean
        required: false
        default: false
        description: "Also release downstream dependents of changed packages"
      labels-to-check:
        type: string
        required: false
        default: '["release", "prerelease"]'
        description: "JSON array of PR labels to check"
      prerelease:
        type: boolean
        required: false
        default: false
        description: "Force prerelease (overrides label)"
      release:
        type: boolean
        required: false
        default: false
        description: "Force release - does both GitHub release and npm publish"
      dry-run:
        type: boolean
        required: false
        default: false
        description: "Run in dry-run mode (no actual publishing)"
      use-blacksmith:
        type: boolean
        required: false
        default: false
        description: "Opt in to Blacksmith Linux runners (blacksmith-4vcpu-ubuntu-2404). Requires the Blacksmith GitHub App installed on the caller org. Defaults to ubuntu-latest."
      use-oidc:
        type: boolean
        required: false
        default: false
        description: "Opt in to npm OIDC Trusted Publishing. When true, the publish job inherits the caller's GITHUB_TOKEN so it can use 'id-token: write' (the caller must grant it) and a trusted publisher must be configured on npmjs.com for every package being released. Falls back to NPM_TOKEN if OIDC is unavailable. When false (default), publishing uses NPM_TOKEN and the job keeps least-privilege 'contents: read'."
    secrets:
      OPENAI_API_KEY:
        required: true
        description: "OpenAI API key for version and notes"
      NPM_TOKEN:
        required: false
        description: "NPM token (required for npm publish when not using OIDC Trusted Publishing, or as a fallback when OIDC isn't configured for some packages)"
      APP_ID:
        required: false
        description: "GitHub App ID for pushing to protected branches and triggering downstream workflows"
      APP_PRIVATE_KEY:
        required: false
        description: "GitHub App private key for pushing to protected branches and triggering downstream workflows"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-labels:
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      pull-requests: read
      contents: read
    outputs:
      labels: ${{ steps.check.outputs.labels }}
    steps:
      - name: Check PR Labels
        id: check
        uses: photon-hq/buildspace/.github/blocks/check-pr-label@main
        with:
          labels: ${{ inputs.labels-to-check }}

  detect-changes:
    needs: check-labels
    if: fromJSON(needs.check-labels.outputs.labels).release || inputs.release || inputs.prerelease || fromJSON(needs.check-labels.outputs.labels).prerelease
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      contents:  read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Changed Packages
        id: detect
        uses: photon-hq/buildspace/.github/blocks/detect-changed-packages@main
        with:
          packages: ${{ inputs.packages }}
          include-dependents: ${{ inputs.include-dependents }}

  bump-versions:
    needs: [check-labels, detect-changes]
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      contents: write
    outputs:
      versions: ${{ steps.bump.outputs.versions }}
      release-notes: ${{ steps.bump.outputs.release-notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bump Monorepo Versions
        id: bump
        uses: photon-hq/buildspace/.github/blocks/bump-monorepo-versions@main
        with:
          changed-packages: ${{ needs.detect-changes.outputs.changed }}
          service-name: ${{ inputs.service-name }}
          prerelease: ${{ inputs.prerelease || fromJSON(needs.check-labels.outputs.labels).prerelease }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ github.token }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

  github-release:
    needs: [check-labels, detect-changes, bump-versions]
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The release/<date>.N counter below counts existing tags; the default
          # shallow checkout fetches no tags, so N was always 0 and a second
          # same-day release reused (and overwrote) the first one's tag.
          fetch-depth: 0
      - name: Build release title
        id: title
        shell: bash
        env:
          VERSIONS_JSON: ${{ needs.bump-versions.outputs.versions }}
          SERVICE_NAME: ${{ inputs.service-name }}
        run: |
          PARTS=$(echo "$VERSIONS_JSON" | jq -r 'to_entries | map("\(.key)@\(.value)") | join(", ")')
          echo "title=${SERVICE_NAME} release (${PARTS})" >> "$GITHUB_OUTPUT"
          TAG_DATE=$(date +%Y-%m-%d)
          EXISTING=$(git tag -l "release/${TAG_DATE}.*" 2>/dev/null | wc -l | tr -d ' ')
          echo "tag=release/${TAG_DATE}.${EXISTING}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: photon-hq/buildspace/.github/blocks/create-github-release@main
        with:
          version: ${{ steps.title.outputs.tag }}
          title: ${{ steps.title.outputs.title }}
          notes: ${{ needs.bump-versions.outputs.release-notes }}
          prerelease: ${{ inputs.prerelease || fromJSON(needs.check-labels.outputs.labels).prerelease }}
          tag-prefix: ""
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

  # Default publish path (use-oidc: false). Keeps least-privilege
  # `contents: read` exactly as before and publishes via NPM_TOKEN. Existing
  # callers are unaffected — no permission changes required on their side.
  npm-publish:
    needs: [check-labels, detect-changes, bump-versions]
    if: inputs.use-oidc != true
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Publish NPM Packages
        uses: photon-hq/buildspace/.github/blocks/publish-npm-packages@main
        with:
          changed-packages: ${{ needs.detect-changes.outputs.changed }}
          bun-version: ${{ inputs.bun-version }}
          tag: ${{ (inputs.prerelease || fromJSON(needs.check-labels.outputs.labels).prerelease) && 'beta' || inputs.npm-tag }}
          build-command: ${{ inputs.build-command }}
          root-build-command: ${{ inputs.root-build-command }}
          dry-run: ${{ inputs.dry-run }}
          npm-token: ${{ secrets.NPM_TOKEN }}

  # OIDC publish path (use-oidc: true). Opt-in only. It omits an explicit
  # `permissions:` block so it inherits the caller's GITHUB_TOKEN — meaning
  # `id-token: write` flows through when the caller grants it. Because it never
  # *requests* id-token, callers that haven't granted it can't be hard-failed;
  # the publish step just falls back to NPM_TOKEN. Default callers never reach
  # this job (the `if` below is false), so their permissions are untouched.
  npm-publish-oidc:
    needs: [check-labels, detect-changes, bump-versions]
    if: inputs.use-oidc == true
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Publish NPM Packages
        uses: photon-hq/buildspace/.github/blocks/publish-npm-packages@main
        with:
          changed-packages: ${{ needs.detect-changes.outputs.changed }}
          bun-version: ${{ inputs.bun-version }}
          tag: ${{ (inputs.prerelease || fromJSON(needs.check-labels.outputs.labels).prerelease) && 'beta' || inputs.npm-tag }}
          build-command: ${{ inputs.build-command }}
          root-build-command: ${{ inputs.root-build-command }}
          dry-run: ${{ inputs.dry-run }}
          npm-token: ${{ secrets.NPM_TOKEN }}
