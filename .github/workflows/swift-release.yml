name: Swift Distribution Package Release
on:
  workflow_call:
    inputs:
      package-name:
        type: string
        required: true
        description: "The name of the package to release"
      identifier:
        type: string
        required: true
        description: "The identifier of the package to release"
      scripts-path:
        type: string
        required: false
        description: "Path to scripts directory containing preinstall/postinstall scripts"
      payload-path:
        type: string
        required: false
        description: "Path to additional payload directory whose contents mirror the install root"
      resource-bundles:
        type: string
        required: false
        default: ""
        description: "Space-separated list of SPM resource bundle names to include in the .pkg"
      entitlements:
        type: string
        required: false
        default: ""
        description: "Path to an entitlements plist for ad-hoc codesigning the built binary."
      private-deps:
        type: boolean
        required: false
        default: false
        description: "Mint an app token (APP_ID/APP_PRIVATE_KEY) so SwiftPM can clone private/internal org dependencies."
      labels-to-check:
        type: string
        required: false
        default: '["release", "prerelease"]'
        description: "JSON array of PR labels to check. `release` cuts a stable release (GitHub release + Jamf deploy); `prerelease` cuts a release candidate (rc) instead — GitHub pre-release only, no Jamf."
      prerelease:
        type: boolean
        required: false
        default: false
        description: "Force a pre-release (rc). Overrides labels. Builds the .pkg, attaches it to a GitHub pre-release, and SKIPS the Jamf upload."
      release:
        type: boolean
        required: false
        default: false
        description: "Force a stable release. Overrides labels."
      jamf-url:
        type: string
        required: false
        default: ""
        description: "Jamf Pro instance URL (e.g. https://acme.jamfcloud.com). Leave empty to skip Jamf upload."
      jamf-package-priority:
        type: string
        required: false
        default: ""
        description: "Priority of the package in Jamf Pro. Leave empty to use default priority."
      jamf-package-name:
        type: string
        required: false
        default: ""
        description: "Package name to match in Jamf Pro. If omitted, the tool uses the file stem of the .pkg."
      use-blacksmith:
        type: boolean
        required: false
        default: false
        description: "Opt in to Blacksmith Linux runners (blacksmith-4vcpu-ubuntu-2404). Requires the Blacksmith GitHub App installed on the caller org. Defaults to ubuntu-latest."
    secrets:
      SECRET_ENV_VARS:
        required: false
      OPENAI_API_KEY:
        required: true
      JAMF_CLIENT_ID:
        required: false
      JAMF_CLIENT_SECRET:
        required: false

jobs:
  check-labels:
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      pull-requests: read
      contents: read
    outputs:
      labels: ${{ steps.check.outputs.labels }}
    steps:
      - name: Check PR Labels
        id: check
        uses: photon-hq/buildspace/.github/blocks/check-pr-label@main
        with:
          labels: ${{ inputs.labels-to-check }}

  prepare-release:
    needs: check-labels
    # Run on a stable release OR a pre-release, whether driven by a PR label
    # or a forced input. `prerelease` is a peer of `release`, not a modifier:
    # either one alone triggers the pipeline.
    if: >-
      fromJSON(needs.check-labels.outputs.labels).release ||
      fromJSON(needs.check-labels.outputs.labels).prerelease ||
      inputs.release ||
      inputs.prerelease
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.generate.outputs.version }}
      release_notes: ${{ steps.generate.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generate Release Info
        id: generate
        uses: photon-hq/buildspace/.github/blocks/generate-release-info@main
        with:
          service-name: ${{ inputs.package-name }}
          prerelease: ${{ inputs.prerelease || fromJSON(needs.check-labels.outputs.labels).prerelease }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

  build:
    needs: prepare-release
    runs-on: macos-26
    steps:
      - name: Mint app token for private SPM deps
        id: app-token
        if: inputs.private-deps
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Swift Build
        id: build
        uses: photon-hq/buildspace/.github/blocks/swift-build@main
        with:
          binary-name: ${{ inputs.package-name }}
          use-cache: "false"
          entitlements: ${{ inputs.entitlements }}
          github-token: ${{ steps.app-token.outputs.token }}
          compile-env: |-
            VERSION=${{ needs.prepare-release.outputs.version }}
            BUILD_ENVIRONMENT=production
            ${{ secrets.SECRET_ENV_VARS }}
          resource-bundles: ${{ inputs.resource-bundles }}
      - name: Swift Package
        uses: photon-hq/buildspace/.github/blocks/swift-pkg@main
        with:
          swift-binary-path: ${{ steps.build.outputs.binary-path }}
          package-name: ${{ inputs.package-name }}
          identifier: ${{ inputs.identifier }}
          version: ${{ needs.prepare-release.outputs.version }}
          scripts-path: ${{ inputs.scripts-path }}
          payload-path: ${{ inputs.payload-path }}
          resource-bundles-path: ${{ steps.build.outputs.resource-bundles-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package-name }}
          path: artifacts/*

  github-release:
    needs: [build, prepare-release, check-labels]
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: photon-hq/buildspace/.github/blocks/create-github-release@main
        with:
          version: ${{ needs.prepare-release.outputs.version }}
          title: "${{ inputs.package-name }} v${{ needs.prepare-release.outputs.version }}"
          notes: ${{ needs.prepare-release.outputs.release_notes }}
          prerelease: ${{ inputs.prerelease || fromJSON(needs.check-labels.outputs.labels).prerelease }}
          artifact-pattern: ${{ inputs.package-name }}

  jamf-upload:
    needs: [build, check-labels]
    # Deploy to the Jamf fleet on stable releases only. A pre-release stops at
    # the GitHub pre-release so it can be tested manually before it ships.
    if: >-
      inputs.jamf-url != '' &&
      !(inputs.prerelease || fromJSON(needs.check-labels.outputs.labels).prerelease)
    uses: photon-hq/jamf-package-updater/.github/workflows/jamf-upload.yml@main
    with:
      artifact_name: ${{ inputs.package-name }}
      package_name: ${{ inputs.jamf-package-name }}
      jamf_url: ${{ inputs.jamf-url }}
      package_priority: ${{ inputs.jamf-package-priority }}
    secrets:
      JAMF_CLIENT_ID: ${{ secrets.JAMF_CLIENT_ID }}
      JAMF_CLIENT_SECRET: ${{ secrets.JAMF_CLIENT_SECRET }}
