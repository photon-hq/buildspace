name: Package PR Build

on:
  workflow_call:
    inputs:
      package-name:
        type: string
        required: true
        description: "Name of the package"
      identifier:
        type: string
        required: true
        description: "Package identifier (e.g. com.example.mytool)"
      scripts-path:
        type: string
        required: false
        description: "Path to scripts directory containing preinstall/postinstall scripts"
      payload-path:
        type: string
        required: false
        description: "Path to additional payload directory whose contents mirror the install root"
      use-blacksmith:
        type: boolean
        required: false
        default: false
        description: "Opt in to Blacksmith Linux runners (blacksmith-4vcpu-ubuntu-2404). Requires the Blacksmith GitHub App installed on the caller org. Defaults to ubuntu-latest."
# Cancel any in-progress run for the same PR when a new commit is pushed.
concurrency:
  group: pkg-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment-start:
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      # ── Notify: build started ────────────────────────────────────────────
      - name: Comment — build started
        uses: photon-hq/buildspace/.github/blocks/comment-on-pr@main
        with:
          comment-key: pkg-release-pr-build
          message: |
            ## Package Build

            | | |
            |---|---|
            | **Status** | ⏳ Building… |
            | **Commit** | ${{ github.sha }} |
            | **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

  build:
    needs: comment-start
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      # ── Build ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v5

      - name: Create Package
        uses: photon-hq/buildspace/.github/blocks/swift-pkg@main
        with:
          package-name: ${{ inputs.package-name }}
          identifier: ${{ inputs.identifier }}
          version: pr.${{ github.event.pull_request.number }}.${{ github.run_number }}
          scripts-path: ${{ inputs.scripts-path }}
          payload-path: ${{ inputs.payload-path }}

      # ── Upload artifact ──────────────────────────────────────────────────
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package-name }}-pr${{ github.event.pull_request.number }}-${{ github.sha }}
          path: artifacts/*.pkg
          retention-days: 7

  comment-success:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      # ── Notify: success ──────────────────────────────────────────────────
      - name: Comment — build succeeded
        uses: photon-hq/buildspace/.github/blocks/comment-on-pr@main
        with:
          comment-key: pkg-release-pr-build
          message: |
            ## Package Build

            | | |
            |---|---|
            | **Status** | ✅ Success |
            | **Commit** | ${{ github.sha }} |
            | **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | **Artifact** | `${{ inputs.package-name }}-pr${{ github.event.pull_request.number }}-${{ github.sha }}` (expires in 7 days) |

            Download the `.pkg` from the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) artifacts section.

  comment-failure:
    needs: build
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      # ── Notify: failure ──────────────────────────────────────────────────
      - name: Comment — build failed
        uses: photon-hq/buildspace/.github/blocks/comment-on-pr@main
        with:
          comment-key: pkg-release-pr-build
          message: |
            ## Package Build

            | | |
            |---|---|
            | **Status** | ❌ Failed |
            | **Commit** | ${{ github.sha }} |
            | **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            Check the [logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
