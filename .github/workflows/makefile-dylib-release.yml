name: Makefile Dylib Release
on:
  workflow_call:
    inputs:
      dylib-name:
        type: string
        required: true
        description: "Name of the output dylib (e.g., imessage-helper)"
      use-blacksmith:
        type: boolean
        required: false
        default: false
        description: "Opt in to Blacksmith Linux runners (blacksmith-4vcpu-ubuntu-2404). Requires the Blacksmith GitHub App installed on the caller org. Defaults to ubuntu-latest."
    secrets:
      OPENAI_API_KEY:
        required: true

jobs:
  check-labels:
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      pull-requests: read
      contents: read
    outputs:
      labels: ${{ steps.check.outputs.labels }}
    steps:
      - name: Check PR Labels
        id: check
        uses: photon-hq/buildspace/.github/blocks/check-pr-label@main
        with:
          labels: '["release"]'

  prepare-release:
    needs: check-labels
    if: fromJSON(needs.check-labels.outputs.labels).release
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.generate.outputs.version }}
      release_notes: ${{ steps.generate.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generate Release Info
        id: generate
        uses: photon-hq/buildspace/.github/blocks/generate-release-info@main
        with:
          service-name: ${{ inputs.dylib-name }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

  build:
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build dylib
        uses: photon-hq/buildspace/.github/blocks/build-makefile-dylib@main
        with:
          output-name: ${{ inputs.dylib-name }}
          version: ${{ needs.prepare-release.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.dylib-name }}
          path: artifacts/*

  github-release:
    needs: [build, prepare-release]
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: photon-hq/buildspace/.github/blocks/create-github-release@main
        with:
          version: ${{ needs.prepare-release.outputs.version }}
          title: "${{ inputs.dylib-name }} v${{ needs.prepare-release.outputs.version }}"
          notes: ${{ needs.prepare-release.outputs.release_notes }}
          artifact-pattern: ${{ inputs.dylib-name }}
