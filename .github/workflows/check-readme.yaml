name: Check README

on:
  workflow_call:
    inputs:
      blocking:
        required: false
        type: boolean
        default: false
        description: 'If true, fail the workflow when the README is outdated. If false (default), only post a warning comment.'
      use-blacksmith:
        required: false
        type: boolean
        default: false
        description: 'Opt in to Blacksmith Linux runners (blacksmith-4vcpu-ubuntu-2404). Requires the Blacksmith GitHub App installed on the caller org. Defaults to ubuntu-latest.'
    secrets:
      OPENAI_API_KEY:
        required: true
        description: 'OpenAI API key for AI-powered README analysis'

jobs:
  check-readme:
    runs-on: ${{ inputs.use-blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      
      - name: Check README
        id: check
        uses: photon-hq/buildspace/.github/blocks/check-readme@main
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Comment on PR if README needs update
        if: steps.check.outputs.up-to-date == 'false'
        uses: photon-hq/buildspace/.github/blocks/comment-on-pr@main
        with:
          comment-key: check-readme
          message: |
            ### 📄 README may need an update

            This PR introduces changes that might not be reflected in `README.md`.

            **Reason:** ${{ steps.check.outputs.explanation }}

            > _This is an automated check powered by AI. If the README is intentionally unchanged, feel free to ignore this._

      - name: Fail if README is outdated and blocking is enabled
        if: steps.check.outputs.up-to-date == 'false' && inputs.blocking
        env:
          EXPLANATION: ${{ steps.check.outputs.explanation }}
        run: |
          printf '::error::README is outdated. %s\n' "$EXPLANATION"
          exit 1

      - name: Remove stale comment if README is up to date
        if: steps.check.outputs.up-to-date == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- comment-key: check-readme -->';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            if (!pr) return;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner, repo, comment_id: existing.id
              });
              console.log(`Deleted stale README check comment ${existing.id}`);
            }
