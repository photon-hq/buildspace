name: 'Rust Build'
description: 'Build Rust binary for multiple targets'

inputs:
  binary-name:
    description: '[string] The name of the crate/binary to build (from Cargo.toml)'
    required: true
  binary-path:
    description: '[string] Optional: Path to crate directory (e.g., "crates/client"). If empty, builds from workspace root using -p flag.'
    required: false
    default: ''
  target:
    description: '[string] Target triple (e.g., x86_64-unknown-linux-gnu)'
    required: true
  build-env:
    description: '[string] Compile-time env vars for .env file (e.g., "BASE_URL=https://example.com")'
    required: false
    default: ''

outputs:
  artifact-name:
    description: 'Name of the artifact'
    value: ${{ steps.package.outputs.name }}
  artifact-path:
    description: 'Path to the built artifact'
    value: ${{ steps.package.outputs.path }}

runs:
  using: 'composite'
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    - name: Install deps (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

    - name: Install deps (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install openssl@3

    - name: Set OpenSSL env (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        OPENSSL_DIR=$(brew --prefix openssl@3)
        echo "OPENSSL_DIR=${OPENSSL_DIR}" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=${OPENSSL_DIR}/lib/pkgconfig" >> $GITHUB_ENV

    - name: Create .env file
      if: inputs.build-env != ''
      shell: bash
      env:
        BUILD_ENV: ${{ inputs.build-env }}
      run: printf '%s\n' "$BUILD_ENV" > .env

    - name: Build
      id: build
      uses: $/.github/primitives/cargo-build
      with:
        binary: ${{ inputs.binary-name }}
        package: ${{ inputs.binary-path == '' && inputs.binary-name || '' }}
        working-directory: ${{ inputs.binary-path || '.' }}
        target: ${{ inputs.target }}

    - name: Package
      id: package
      uses: $/.github/primitives/stage-file
      with:
        source: ${{ steps.build.outputs.binary-path }}
        destination: artifacts/${{ inputs.binary-name }}-${{ inputs.target }}${{ contains(inputs.target, 'windows') && '.exe' || '' }}
        executable: ${{ runner.os != 'Windows' }}
