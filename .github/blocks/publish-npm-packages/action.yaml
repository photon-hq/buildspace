name: 'Publish NPM Packages'
description: 'Build and publish multiple monorepo packages to npm in dependency order'

inputs:
  changed-packages:
    description: '[string] JSON array of packages in topological order (e.g. [{"name":"@acme/app","path":"packages/app"}])'
    required: true
  bun-version:
    description: '[string] Bun version to use'
    required: false
    default: 'latest'
  node-version:
    description: '[string] Node.js version'
    required: false
    default: '24'
  tag:
    description: "[string] NPM tag (e.g., 'latest', 'beta')"
    required: false
    default: 'latest'
  build-command:
    description: '[string] Build command to run in each package directory (ignored if root-build-command is set)'
    required: false
    default: 'bun run build'
  root-build-command:
    description: '[string] Build command to run once at repo root (e.g., "turbo build"). Takes precedence over per-package build-command.'
    required: false
    default: ''
  dry-run:
    description: "[boolean: 'true'/'false'] Run in dry-run mode (no actual publishing)"
    required: false
    default: 'false'
  npm-token:
    description: '[secret] NPM authentication token'
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org
    - name: Install dependencies
      shell: bash
      run: bun install
    - name: Build (root)
      if: inputs.root-build-command != ''
      shell: bash
      env:
        BUILD_COMMAND: ${{ inputs.root-build-command }}
      run: bash -euo pipefail -c "$BUILD_COMMAND"
    - name: Build and publish packages in dependency order
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CHANGED_JSON: ${{ inputs.changed-packages }}
        BUILD_CMD: ${{ inputs.build-command }}
        ROOT_BUILD_CMD: ${{ inputs.root-build-command }}
        TAG: ${{ inputs.tag }}
        DRY_RUN: ${{ inputs.dry-run }}
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
        REGISTRY_URL: https://registry.npmjs.org
        PACKAGE_ACCESS: public
        PACKAGE_OWNER: ''
      run: node "$ACTION_PATH/../publish-packages.mjs"
