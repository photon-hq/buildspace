name: 'Publish NPM Packages'
description: 'Build and publish multiple monorepo packages to npm in dependency order'

inputs:
  changed-packages:
    description: '[string] JSON array of packages in topological order (e.g. [{"name":"photon","path":"packages/photon"}])'
    required: true
  bun-version:
    description: '[string] Bun version to use'
    required: false
    default: 'latest'
  node-version:
    description: '[string] Node.js version'
    required: false
    default: '24'
  tag:
    description: "[string] NPM tag (e.g., 'latest', 'beta')"
    required: false
    default: 'latest'
  build-command:
    description: '[string] Build command to run in each package directory (ignored if root-build-command is set)'
    required: false
    default: 'bun run build'
  root-build-command:
    description: '[string] Build command to run once at repo root (e.g., "turbo build"). Takes precedence over per-package build-command.'
    required: false
    default: ''
  dry-run:
    description: "[boolean: 'true'/'false'] Run in dry-run mode (no actual publishing)"
    required: false
    default: 'false'
  npm-token:
    description: 'NPM authentication token. Used only as a fallback when npm OIDC Trusted Publishing is unavailable or fails. Not required if OIDC Trusted Publishing is fully configured for every package being released.'
    required: false

runs:
  using: 'composite'
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      shell: bash
      run: bun install

    - name: Build (root)
      if: ${{ inputs.root-build-command != '' }}
      shell: bash
      run: ${{ inputs.root-build-command }}

    - name: Build and publish packages
      shell: bash
      env:
        CHANGED_JSON: ${{ inputs.changed-packages }}
        BUILD_CMD: ${{ inputs.build-command }}
        ROOT_BUILD_CMD: ${{ inputs.root-build-command }}
        TAG: ${{ inputs.tag }}
        DRY_RUN: ${{ inputs.dry-run }}
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
      run: |
        set -euo pipefail

        PKG_COUNT=$(echo "$CHANGED_JSON" | jq 'length')

        for i in $(seq 0 $(( PKG_COUNT - 1 ))); do
          NAME=$(echo "$CHANGED_JSON" | jq -r ".[$i].name")
          PKG_PATH=$(echo "$CHANGED_JSON" | jq -r ".[$i].path")

          echo "========================================="
          echo "Publishing $NAME ($PKG_PATH)"
          echo "========================================="

          if [ -z "$ROOT_BUILD_CMD" ]; then
            echo "Building $NAME..."
            (cd "$PKG_PATH" && $BUILD_CMD)
          fi

          # Dry-run only validates packaging, so do it before any auth checks.
          # `bun publish --dry-run` is fine here because it doesn't hit the
          # registry; we keep it on bun so workspace:* deps still resolve.
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would publish $NAME with tag $TAG"
            (cd "$PKG_PATH" && bun publish --tag "$TAG" --access public --dry-run)
            echo ""
            continue
          fi

          # Step 1: try npm OIDC Trusted Publishing (tokenless, with
          # provenance). bun publish doesn't yet support OIDC
          # (oven-sh/bun#15601), so we use the documented workaround: pack
          # with bun (preserves workspace:* rewriting that npm pack would
          # leave broken) and publish the tarball with npm. The runner only
          # sets ACTIONS_ID_TOKEN_REQUEST_TOKEN when the job has
          # 'id-token: write', so when that permission is absent we skip OIDC
          # entirely rather than run a publish that is guaranteed to fail on
          # auth.
          PUBLISHED=false
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "🔒 Attempting publish of $NAME via npm Trusted Publishing (OIDC)..."
            if (
              cd "$PKG_PATH"
              rm -f -- *.tgz 2>/dev/null || true
              bun pm pack
              TARBALL=$(ls -t -- *.tgz | head -n 1)
              [ -n "$TARBALL" ]
              npm publish "$TARBALL" --tag "$TAG" --access public --provenance
            ); then
              echo "✅ Published $NAME via OIDC Trusted Publishing."
              PUBLISHED=true
            else
              echo "⚠️ OIDC publish of $NAME failed. Falling back to NPM token."
            fi
          else
            echo "ℹ️ No OIDC id-token available (job lacks 'id-token: write'). Skipping OIDC; will use NPM token."
          fi

          # Step 2: fall back to the traditional token-based publish. Same
          # bun publish flow as before, so workspace:* deps continue to
          # resolve. Only reached when OIDC was skipped or failed.
          if [ "$PUBLISHED" != "true" ]; then
            if [ -z "$NODE_AUTH_TOKEN" ]; then
              echo "❌ OIDC was unavailable or failed, and no NPM token was provided. Cannot publish $NAME."
              exit 1
            fi
            echo "🔑 Publishing $NAME via NPM token with tag $TAG"
            (cd "$PKG_PATH" && bun publish --tag "$TAG" --access public)
          fi

          echo ""
        done

        echo "All packages published successfully"
