name: "Swift Build"
description: "Build Swift project"

inputs:
  binary-name:
    description: "Name of the binary to build"
    required: false
  compile-env:
    description: "Env values to set when compiling"
    required: false
    default: ""
  use-cache:
    description: "Cache SwiftPM dependencies (disable for release builds)"
    required: false
    default: "true"
  resource-bundles:
    description: "Space-separated list of SPM resource bundle names to include (e.g. 'Foo_Foo.bundle')"
    required: false
    default: ""
  entitlements:
    description: "Path to an entitlements plist (relative to repo root). When set, the built binary is ad-hoc codesigned with these entitlements. Needed for daemons that require private entitlements (e.g. to connect to imagent)."
    required: false
    default: ""
  github-token:
    description: "Token with read access to private/internal SPM dependencies. When set, git is configured to use it for github.com clones (so SwiftPM can fetch private deps)."
    required: false
    default: ""

outputs:
  binary-path:
    description: "Path to built binary"
    value: ${{ steps.build.outputs.binary-path }}
  resource-bundles-path:
    description: "Path to staging directory containing collected resource bundles (empty if none)"
    value: ${{ steps.bundles.outputs.resource-bundles-path }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
    - uses: swift-actions/setup-swift@v3
    - name: Cache SwiftPM dependencies
      if: inputs.use-cache == 'true'
      uses: actions/cache@v5
      with:
        path: |
          .build/checkouts
          .build/repositories
          .build/artifacts
        key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
        restore-keys: swiftpm-${{ runner.os }}-
    - name: Prepare .env
      if: inputs.compile-env != ''
      shell: bash
      env:
        COMPILE_ENV: ${{ inputs.compile-env }}
      run: printf '%s\n' "$COMPILE_ENV" > .env
    - name: Configure git auth for private/internal SPM dependencies
      if: inputs.github-token != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
    - name: Build Swift Binary
      id: build
      uses: $/.github/primitives/swift-build
      with:
        product: ${{ inputs.binary-name }}
    - name: Sign Swift binary
      if: inputs.entitlements != ''
      shell: bash
      env:
        BINARY: ${{ steps.build.outputs.binary-path }}
        ENTITLEMENTS: ${{ inputs.entitlements }}
      run: codesign -s - --entitlements "$ENTITLEMENTS" -f "$BINARY"
    - name: Stage binary
      uses: $/.github/primitives/stage-file
      with:
        source: ${{ steps.build.outputs.binary-path }}
        destination: artifacts/${{ inputs.binary-name }}
    - name: Collect resource bundles
      id: bundles
      shell: bash
      env:
        RESOURCE_BUNDLES: ${{ inputs.resource-bundles }}
      run: |
        BUNDLES_PATH=""
        if [ -n "$RESOURCE_BUNDLES" ]; then
          BUNDLES_PATH="${RUNNER_TEMP}/resource-bundles"
          mkdir -p "$BUNDLES_PATH"
          for BUNDLE in $RESOURCE_BUNDLES; do
            SRC=".build/release/${BUNDLE}"
            if [ -d "$SRC" ]; then
              cp -R "$SRC" "$BUNDLES_PATH/"
              echo "Collected resource bundle: ${BUNDLE}"
            else
              echo "::error::Resource bundle not found: ${SRC}"
              exit 1
            fi
          done
        fi
        echo "resource-bundles-path=${BUNDLES_PATH}" >> $GITHUB_OUTPUT
