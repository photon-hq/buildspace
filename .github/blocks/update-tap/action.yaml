name: 'Update Homebrew Tap'
description: 'Update a formula version in the Homebrew tap (auto-calculates SHA256)'

inputs:
  formula-name:
    description: '[string] Name of the formula (e.g., "jamf-package-updater")'
    required: true
  version:
    description: '[string] Version number (e.g., "1.2.3")'
    required: true
  tap-repo:
    description: '[string] The tap repository (e.g., "photon-hq/homebrew-photon")'
    required: true
  app-id:
    description: '[secret] GitHub App ID for pushing to the tap repository'
    required: true
  app-private-key:
    description: '[secret] GitHub App private key for pushing to the tap repository'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Extract tap repo name
      id: tap-info
      shell: bash
      run: |
        TAP_REPO_NAME=$(echo "${{ inputs.tap-repo }}" | cut -d'/' -f2)
        echo "repo-name=${TAP_REPO_NAME}" >> $GITHUB_OUTPUT

    - name: Generate App Token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ steps.tap-info.outputs.repo-name }},${{ github.event.repository.name }}

    - name: Checkout tap repository
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.tap-repo }}
        token: ${{ steps.app-token.outputs.token }}
        path: _homebrew_tap

    - name: Update formula
      shell: bash
      env:
        FORMULA_NAME: ${{ inputs.formula-name }}
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        FORMULA="_homebrew_tap/Formula/${FORMULA_NAME}.rb"

        if [ ! -f "$FORMULA" ]; then
          echo "::error::Formula not found: $FORMULA"
          echo "Please create the formula manually first, then use this action for updates."
          exit 1
        fi

        echo "Updating formula: $FORMULA to v$VERSION"

        # Detect formula type
        if grep -q "registry.npmjs.org" "$FORMULA"; then
          FORMULA_TYPE="npm"
        elif grep -q 'depends_on "go"' "$FORMULA"; then
          FORMULA_TYPE="go"
        elif grep -q "on_macos do\|on_linux do" "$FORMULA"; then
          FORMULA_TYPE="prebuilt"
        else
          echo "::error::Unknown formula type"
          exit 1
        fi

        echo "Detected formula type: $FORMULA_TYPE"

        get_sha256() {
          local url="$1"
          local tmpdir=$(mktemp -d)
          # Parse GitHub release URL: https://github.com/OWNER/REPO/releases/download/TAG/ASSET
          local path="${url#https://github.com/}"
          local repo=$(echo "$path" | cut -d'/' -f1-2)
          local tag=$(echo "$path" | cut -d'/' -f5)
          local asset=$(echo "$path" | cut -d'/' -f6-)

          gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$tmpdir" >/dev/null 2>&1
          shasum -a 256 "$tmpdir/$asset" | cut -d' ' -f1
          rm -rf "$tmpdir"
        }

        case "$FORMULA_TYPE" in
          npm)
            PACKAGE=$(grep -o 'registry.npmjs.org/[^/]*' "$FORMULA" | head -1 | cut -d'/' -f2)
            NEW_URL="https://registry.npmjs.org/${PACKAGE}/-/${PACKAGE}-${VERSION}.tgz"
            echo "Fetching: $NEW_URL"
            SHA256=$(get_sha256 "$NEW_URL")
            echo "SHA256: $SHA256"

            sed -i.bak "s|/-/${PACKAGE}-[^\"]*\.tgz|/-/${PACKAGE}-${VERSION}.tgz|g" "$FORMULA"
            sed -i.bak "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA256}\"|g" "$FORMULA"
            rm -f "$FORMULA.bak"
            ;;

          go)
            REPO_URL=$(grep -o 'https://github.com/[^/]*/[^/]*' "$FORMULA" | head -1)
            NEW_URL="${REPO_URL}/archive/refs/tags/v${VERSION}.tar.gz"
            echo "Fetching: $NEW_URL"
            SHA256=$(get_sha256 "$NEW_URL")
            echo "SHA256: $SHA256"

            sed -i.bak "s|/archive/refs/tags/v[^\"]*|/archive/refs/tags/v${VERSION}.tar.gz|g" "$FORMULA"
            sed -i.bak "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA256}\"|g" "$FORMULA"
            rm -f "$FORMULA.bak"
            ;;

          prebuilt)
            # Update version
            sed -i.bak "s|version \"[^\"]*\"|version \"${VERSION}\"|g" "$FORMULA"

            # Update release URLs
            sed -i.bak "s|/releases/download/v[^/]*/|/releases/download/v${VERSION}/|g" "$FORMULA"

            # Compute SHA256 for each platform URL
            ARM_URL=$(grep -A1 "on_arm do" "$FORMULA" | grep -o 'https://[^"]*' | head -1)
            if [ -n "$ARM_URL" ]; then
              echo "Fetching ARM64: $ARM_URL"
              ARM_SHA=$(get_sha256 "$ARM_URL")
              echo "ARM64 SHA256: $ARM_SHA"
            fi

            INTEL_URL=$(grep -A1 "on_intel do" "$FORMULA" | grep -o 'https://[^"]*' | head -1)
            if [ -n "$INTEL_URL" ]; then
              echo "Fetching Intel: $INTEL_URL"
              INTEL_SHA=$(get_sha256 "$INTEL_URL")
              echo "Intel SHA256: $INTEL_SHA"
            fi

            LINUX_URL=$(grep -A2 "on_linux do" "$FORMULA" | grep -o 'https://[^"]*' | head -1)
            if [ -n "$LINUX_URL" ]; then
              echo "Fetching Linux: $LINUX_URL"
              LINUX_SHA=$(get_sha256 "$LINUX_URL")
              echo "Linux SHA256: $LINUX_SHA"
            fi

            # Update per-platform SHA256 hashes
            awk -v arm_sha="$ARM_SHA" -v intel_sha="$INTEL_SHA" -v linux_sha="$LINUX_SHA" '
              /on_arm do/ { in_arm=1 }
              /on_intel do/ && !in_linux { in_intel=1 }
              /on_linux do/ { in_linux=1; in_intel=0 }
              /sha256/ && in_arm { gsub(/sha256 "[a-f0-9A-Z]+"/, "sha256 \"" arm_sha "\""); in_arm=0 }
              /sha256/ && in_intel && !in_linux { gsub(/sha256 "[a-f0-9A-Z]+"/, "sha256 \"" intel_sha "\""); in_intel=0 }
              /sha256/ && in_linux { gsub(/sha256 "[a-f0-9A-Z]+"/, "sha256 \"" linux_sha "\""); in_linux=0 }
              { print }
            ' "$FORMULA" > "$FORMULA.tmp" && mv "$FORMULA.tmp" "$FORMULA"

            rm -f "$FORMULA.bak"
            ;;
        esac

        echo ""
        echo "--- Updated formula ---"
        cat "$FORMULA"
        echo "--- End ---"

    - name: Commit and push
      shell: bash
      working-directory: _homebrew_tap
      run: |
        git config user.name "photon-release[bot]"
        git config user.email "photon-release[bot]@users.noreply.github.com"

        git add Formula/

        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update ${{ inputs.formula-name }} to v${{ inputs.version }}"
          git push
          echo "Pushed update to tap"
        fi
