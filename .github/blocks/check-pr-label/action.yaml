name: 'Check PR Labels'
description: 'Inspect configured PR labels and return boolean results for the caller'

inputs:
  labels:
    description: 'JSON array of labels to check (e.g., ["needs-review", "documentation"])'
    required: true
  default-on-push:
    description: 'Comma-separated labels to default to true on non-PR events only when GitHub confirms no associated PRs'
    required: false
    default: ''

outputs:
  labels:
    description: 'JSON object with boolean results for each checked label'
    value: ${{ steps.check-labels.outputs.labels }}

runs:
  using: 'composite'
  steps:
    - name: Check PR Labels
      id: check-labels
      uses: actions/github-script@v7
      env:
        LABELS_TO_CHECK: ${{ inputs.labels }}
        DEFAULT_ON_PUSH: ${{ inputs.default-on-push }}
      with:
        script: |
          const defaultOnPush = (process.env.DEFAULT_ON_PUSH || '').split(',').map(l => l.trim().toLowerCase()).filter(Boolean);
          const labelsToCheck = JSON.parse(process.env.LABELS_TO_CHECK);
          if (!Array.isArray(labelsToCheck) || labelsToCheck.some(label => typeof label !== 'string' || !label)) {
            throw new Error('labels must be a JSON array of nonempty strings.');
          }
          
          let pr = null;
          let prLabels = [];
          let noAssociatedPr = false;
          
          if (context.eventName === 'pull_request') {
            pr = context.payload.pull_request;
            prLabels = (pr.labels || []).map(l => l.name.toLowerCase());
            console.log(`PR event: Found PR #${pr.number} with labels: ${prLabels.join(', ') || 'none'}`);
          } else {
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              per_page: 100
            });
            noAssociatedPr = prs.length === 0;
            const branch = context.ref.replace('refs/heads/', '');
            const candidates = prs.filter(candidate => candidate.merged_at &&
              candidate.base.ref === branch && candidate.merge_commit_sha === context.sha);
            if (candidates.length > 1) {
              throw new Error('Multiple merged PRs are associated with this commit and branch.');
            }
            pr = candidates[0] || null;
            if (pr) {
              const { data: prWithLabels } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });
              prLabels = (prWithLabels.labels || []).map(l => l.name.toLowerCase());
            }
          }
          
          const results = {};
          for (const label of labelsToCheck) {
            const labelLower = label.toLowerCase();
            let hasLabel = prLabels.includes(labelLower);
            if (!hasLabel && noAssociatedPr && defaultOnPush.includes(labelLower)) {
              hasLabel = true;
            }
            results[labelLower] = hasLabel;
          }
          
          console.log('Label check results:', JSON.stringify(results));
          core.setOutput('labels', JSON.stringify(results));
          return results;
