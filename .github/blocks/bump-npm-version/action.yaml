name: 'Bump NPM Version'
description: 'Bump version in package.json and push to repository'

inputs:
  version:
    description: '[string] The version to set (e.g., 1.2.3)'
    required: true
  working-directory:
    description: '[string] Directory containing package.json'
    required: false
    default: '.'
  github-token:
    description: '[secret] GitHub token (fallback if no app credentials provided)'
    required: true
  app-id:
    description: '[secret] GitHub App ID for pushing to protected branches (optional)'
    required: false
    default: ''
  app-private-key:
    description: '[secret] GitHub App private key for pushing to protected branches (optional)'
    required: false
    default: ''
  commit-user-name:
    description: '[string] Git user name for release commits'
    required: false
    default: 'photon-release[bot]'
  commit-user-email:
    description: '[string] Git user email for release commits'
    required: false
    default: 'photon-release[bot]@users.noreply.github.com'

runs:
  using: 'composite'
  steps:
    - name: Generate App Token
      id: app-token
      if: ${{ inputs.app-id != '' && inputs.app-private-key != '' }}
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}

    - name: Configure git credentials
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
        FALLBACK_TOKEN: ${{ inputs.github-token }}
      run: |
        TOKEN="${APP_TOKEN:-$FALLBACK_TOKEN}"
        
        if [ -n "$APP_TOKEN" ]; then
          echo "Using GitHub App token"
        else
          echo "Using fallback github.token"
        fi
        
        git config --local --unset-all http.https://github.com/.extraheader || true
        
        AUTH=$(echo -n "x-access-token:${TOKEN}" | base64 | tr -d '\n')
        git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"

    - name: Pull latest changes
      shell: bash
      env:
        BRANCH: ${{ github.ref_name }}
      run: git pull --ff-only origin "$BRANCH"

    - name: Update package.json version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERSION: ${{ inputs.version }}
      run: |
        echo "Updating package.json to version ${VERSION}..."
        jq --arg ver "$VERSION" '.version = $ver' package.json > package.json.tmp
        mv package.json.tmp package.json
        echo "Updated to version ${VERSION}"

    - name: Configure git identity
      shell: bash
      env:
        COMMIT_USER_NAME: ${{ inputs.commit-user-name }}
        COMMIT_USER_EMAIL: ${{ inputs.commit-user-email }}
      run: |
        git config user.name "$COMMIT_USER_NAME"
        git config user.email "$COMMIT_USER_EMAIL"

    - name: Stage version changes
      uses: $/.github/primitives/git-stage
      with:
        paths: '["."]'

    - name: Commit version changes
      id: commit
      uses: $/.github/primitives/git-commit
      with:
        message: 'chore: bump version to ${{ inputs.version }}'

    - name: Rebase the release commit on the latest branch
      if: steps.commit.outputs.committed == 'true'
      shell: bash
      env:
        BRANCH: ${{ github.ref_name }}
      run: git pull --rebase origin "$BRANCH"

    - name: Push version changes
      if: steps.commit.outputs.committed == 'true'
      uses: $/.github/primitives/git-push
