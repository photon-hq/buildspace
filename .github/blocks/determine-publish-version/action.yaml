name: 'Determine Publish Version'
description: 'Determine the version to publish based on commit history and semantic versioning'

inputs:
  prerelease:
    description: "[boolean: 'true'/'false'] Whether this is a prerelease (appends -rc.N suffix)"
    required: false
    default: 'false'
  openai-api-key:
    description: '[secret] OpenAI API key for AI-powered version detection'
    required: true

outputs:
  version:
    description: 'The determined version (e.g., 1.2.3 or 1.2.3-rc.5)'
    value: ${{ steps.version.outputs.final }}
  previous-version:
    description: 'The previous version before this release'
    value: ${{ steps.last-release.outputs.version }}
  release-type:
    description: 'The bump type relative to the last STABLE (non-prerelease) release: major | minor | patch. Comparing against the last stable, not the last release-of-any-kind, so GA finalization after a prerelease (2.0.0-rc.3 -> 2.0.0) is correctly classified as the original bump (here, major) instead of patch.'
    value: ${{ steps.classify.outputs.kind }}

runs:
  using: 'composite'
  steps:
    - name: Get last release info
      id: last-release
      uses: actions/github-script@v7
      with:
        script: |
          try {
            // Pull a page of recent releases so we can pick out both the
            // last release of any kind (used for the AI commit range —
            // the AI should only describe NEW changes since the previous
            // tag, prerelease or not) and the last STABLE release (used
            // for semver classification — a GA finalization of an -rc
            // should classify as the original bump kind, not patch).
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const nonDraft = releases.filter(r => !r.draft);
            const latest = nonDraft[0];
            const lastStable = nonDraft.find(r => !r.prerelease);

            if (latest) {
              const tagName = latest.tag_name;
              const { data: ref } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`
              });
              core.setOutput('sha', ref.object.sha);
              core.setOutput('version', tagName.replace(/^v/, ''));
            } else {
              const allCommits = await github.paginate(github.rest.repos.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              core.setOutput('sha', allCommits[allCommits.length - 1].sha);
              core.setOutput('version', '0.0.0');
            }

            // Last stable: its SHA is the base for both the diff range and the
            // version computation (so rc-to-rc publishes stay on the same core
            // line instead of advancing off a prerelease tag), and its version
            // is the classification baseline. Empty/0.0.0 on the initial release.
            if (lastStable) {
              const { data: sref } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${lastStable.tag_name}`
              });
              core.setOutput('stable_sha', sref.object.sha);
              core.setOutput('stable_version', lastStable.tag_name.replace(/^v/, ''));
            } else {
              core.setOutput('stable_sha', '');
              core.setOutput('stable_version', '0.0.0');
            }
          } catch (error) {
            core.setOutput('sha', context.sha);
            core.setOutput('version', '0.0.0');
            core.setOutput('stable_sha', '');
            core.setOutput('stable_version', '0.0.0');
          }

    - name: Write version prompt
      id: context
      shell: bash
      env:
        BASE_SHA: ${{ steps.last-release.outputs.stable_sha }}
        HEAD_SHA: ${{ github.sha }}
        STABLE_VERSION: ${{ steps.last-release.outputs.stable_version }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        set -euo pipefail
        # No prior stable release -> diff against the empty tree so the entire
        # history (including the root commit) is included for the initial release.
        if [ -n "$BASE_SHA" ]; then
          DIFF_BASE="$BASE_SHA"; LOG_RANGE="$BASE_SHA..$HEAD_SHA"
        else
          DIFF_BASE=$(git hash-object -t tree /dev/null); LOG_RANGE="$HEAD_SHA"
        fi
        clip() { if [ "${#1}" -gt "$2" ]; then printf '%s\n(...truncated at %s chars; run git diff for the rest...)' "${1:0:$2}" "$2"; else printf '%s' "$1"; fi; }
        NAME_STATUS=$(clip "$(git diff --name-status "$DIFF_BASE" "$HEAD_SHA")" 60000)
        STAT=$(clip "$(git diff --stat "$DIFF_BASE" "$HEAD_SHA")" 40000)
        LOG=$(clip "$(git log --no-merges --format='- %s%n%b' $LOG_RANGE)" 100000)
        DIFF=$(clip "$(git diff "$DIFF_BASE" "$HEAD_SHA")" 400000)
        PROMPT_FILE="${RUNNER_TEMP}/determine-publish-version-prompt.md"
        {
          echo "Determine the next semantic version after ${STABLE_VERSION}."
          echo "Current version: ${STABLE_VERSION}"
          echo "Prerelease: ${PRERELEASE}"
          echo
          cat <<'PROMPT'
        Base your decision on the ACTUAL CODE CHANGES below — the commit
        messages, changed files, and diff are all provided. Commit types such
        as `feat:` and `fix:` are hints, not commands. The public compatibility
        impact shown by the diff is the source of truth. If the diff was
        truncated you may run `git diff` yourself (read-only) for any file.

        This project classifies releases by the practical migration burden on
        developers, not by code-level incompatibility alone. Choose the highest
        bump that is concretely justified:
        1. MAJOR — a forced, substantially disruptive migration. Use this only
           when existing supported consumers cannot keep their current code or
           version working and must perform significant refactoring, data
           migration, reconfiguration, or operational work. Examples include
           older clients being rejected by a changed protocol, an existing
           service/configuration ceasing to work until migrated, or a public
           contract being redesigned so broadly that upgrading requires
           extensive consumer changes.

           An explicit `BREAKING CHANGE:` footer, a `type!:` marker, or a
           technically incompatible diff is evidence to inspect, not an
           automatic MAJOR. Do NOT choose MAJOR when consumers can safely keep
           using the previous version and their existing code continues to run,
           or when adopting the new version requires only small, localized
           edits. In those cases there is no forced substantial migration, so
           choose MINOR at most. Blast radius, visibility, changed-line count,
           or the fact that behavior is automatic are also not sufficient by
           themselves.
        2. MINOR — new user-visible functionality, or an intentional public
           API/behavior change that does not meet the MAJOR threshold. This
           includes a new endpoint, flag, export, option, capability, newly
           supported case, or a technically incompatible change whose adoption
           is optional or needs only a small, localized consumer update.
           Returning richer information through an already supported public
           type/variant can be minor when it handles data that was previously
           ignored or lost. A commit labeled `fix:` can therefore still be
           minor if it gives users a meaningful new capability.
        3. PATCH — a backward-compatible correction or maintenance change that
           adds no new user capability: bug fixes that restore already-promised
           behavior, performance work, refactors, tests, docs, and chores.

        Use these tie-breakers:
        - Do not treat observed buggy or incomplete behavior as a compatibility
          guarantee unless it was a documented, supported contract.
        - Ask what happens to an existing consumer in practice. If their
          current code/version keeps working and they are not forced to adopt
          this release, the change is not MAJOR, even if the new API is
          technically incompatible.
        - A behavior or API change can be PATCH or MINOR; it is MAJOR only when
          it forces a substantial migration to keep a supported use case
          working.
        - To distinguish MINOR from PATCH, ask whether users can now do or
          receive something meaningful they could not before. If yes, MINOR;
          if the same promised capability merely works correctly, PATCH.
        - Documentation for functionality that already existed is PATCH.
        - When genuinely unclear between two levels, choose the lower one.

        Examples:
        - Optional media captions were previously discarded; they are now
          exposed as attachment + text using an already-public group variant,
          while media without captions is unchanged: MINOR, not MAJOR.
        - A new optional API method or config flag: MINOR.
        - A public field is renamed, but adoption is optional and upgrading
          needs only a few localized caller edits: MINOR, not MAJOR.
        - A protocol change rejects existing clients and forces extensive
          client migrations to restore service: MAJOR.
        - A crash is fixed without adding a capability: PATCH.
        PROMPT
          echo
          echo "A major bump of ${STABLE_VERSION} increments the first number and"
          echo "zeroes the rest (e.g. 0.1.5 -> 1.0.0); minor increments the"
          echo "second (0.1.5 -> 0.2.0); patch the third (0.1.5 -> 0.1.6)."
          echo "For prereleases use the same logic — the -rc suffix is added automatically."
          echo
          echo "=== CHANGES SINCE ${STABLE_VERSION} ==="
          echo "## Commit messages"
          echo "$LOG"
          echo
          echo "## Files changed (A=added M=modified D=deleted R=renamed)"
          echo "$NAME_STATUS"
          echo
          echo "## Churn summary"
          echo "$STAT"
          echo
          echo "## Full diff"
          echo '```diff'
          echo "$DIFF"
          echo '```'
          echo "=== END CHANGES ==="
          echo
          echo "Respond with ONLY X.Y.Z"
        } > "$PROMPT_FILE"
        echo "prompt-file=${PROMPT_FILE}" >> "$GITHUB_OUTPUT"

    - name: AI Determine Version
      id: ai-version
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        model: gpt-5.5
        safety-strategy: read-only
        effort: high
        prompt-file: ${{ steps.context.outputs.prompt-file }}

    - name: Parse Version
      id: version
      shell: bash
      run: |
        RAW_OUTPUT="${{ steps.ai-version.outputs.final-message }}"
        echo "Raw AI version output: '${RAW_OUTPUT}'"
        
        if [ -z "$RAW_OUTPUT" ]; then
          echo "::error::AI version step produced no output. Check that 'ai-version' step ran successfully."
          exit 1
        fi
        
        NEXT=$(echo "$RAW_OUTPUT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        
        if [ -z "$NEXT" ]; then
          echo "::error::Could not parse semantic version (X.Y.Z) from AI output: '${RAW_OUTPUT}'"
          exit 1
        fi
        
        if [ "${{ inputs.prerelease }}" == "true" ]; then
          echo "final=${NEXT}-rc.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
        else
          echo "final=${NEXT}" >> $GITHUB_OUTPUT
        fi
        
        echo "Determined version: ${NEXT}"

    - name: Classify Bump
      id: classify
      shell: bash
      env:
        # Use the last STABLE version (not last-of-any-kind) so that
        # finalizing a prerelease into GA (e.g. 2.0.0-rc.3 -> 2.0.0)
        # classifies as the original bump (major here), not patch.
        # Without this, prev_core == next_core after stripping suffixes
        # and the GA's notify path silently downgrades to patch.
        PREV: ${{ steps.last-release.outputs.stable_version }}
        NEXT: ${{ steps.version.outputs.final }}
      run: |
        # Strip any pre-release suffix (e.g. -rc.5) on NEXT before
        # comparing. PREV is already stable so it has no suffix.
        prev_core="${PREV%%-*}"
        next_core="${NEXT%%-*}"

        IFS='.' read -r p_major p_minor p_patch <<< "$prev_core"
        IFS='.' read -r n_major n_minor n_patch <<< "$next_core"

        : "${p_major:=0}"; : "${p_minor:=0}"; : "${p_patch:=0}"
        : "${n_major:=0}"; : "${n_minor:=0}"; : "${n_patch:=0}"

        if [ "$n_major" -gt "$p_major" ]; then
          kind="major"
        elif [ "$n_minor" -gt "$p_minor" ]; then
          kind="minor"
        else
          kind="patch"
        fi

        echo "kind=$kind" >> "$GITHUB_OUTPUT"
        echo "Classified bump: $prev_core -> $next_core => $kind"
