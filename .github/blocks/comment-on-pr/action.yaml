name: "Comment on PR"
description: "Post, update, or remove a marked comment on a pull request"

inputs:
  message:
    description: "The comment body (markdown supported)"
    required: false
    default: ""
  comment-key:
    description: "A unique string used to find and update an existing comment instead of creating a new one"
    required: false
    default: ""
  state:
    description: "Use present (default) to create/update, or absent to remove the first comment with a nonempty comment-key"
    required: false
    default: "present"

runs:
  using: composite
  steps:
    - name: Post or update PR comment
      uses: actions/github-script@v7
      env:
        COMMENT_MESSAGE: ${{ inputs.message }}
        COMMENT_KEY: ${{ inputs.comment-key }}
        COMMENT_STATE: ${{ inputs.state }}
      with:
        script: |
          const message = process.env.COMMENT_MESSAGE;
          const commentKey = process.env.COMMENT_KEY;
          const pr = context.payload.pull_request;

          if (!pr) {
            core.warning('No pull_request payload found — skipping PR comment.');
            return;
          }

          const state = process.env.COMMENT_STATE || 'present';
          if (!['present', 'absent'].includes(state)) {
            throw new Error('Comment state must be present or absent.');
          }
          if (state === 'absent' && !commentKey?.trim()) {
            throw new Error('Removing a comment requires a nonempty comment-key.');
          }
          if (commentKey && /[\r\n]|<!--|-->/.test(commentKey)) {
            throw new Error('Comment keys cannot contain line breaks or HTML comment delimiters.');
          }
          const { owner, repo } = context.repo;
          const issue_number = pr.number;

          if (commentKey) {
            const marker = `<!-- comment-key: ${commentKey} -->`;
            const body = `${marker}\n${message}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (state === 'absent') {
              if (existing) {
                await github.rest.issues.deleteComment({owner, repo, comment_id: existing.id});
              }
              return;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body
              });
              console.log(`Updated comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
              console.log('Created new comment');
            }
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: message
            });
            console.log('Created new comment');
          }
