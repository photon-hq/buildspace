name: "Comment on PR"
description: "Post or update a comment on a pull request"

inputs:
  message:
    description: "The comment body (markdown supported)"
    required: true
  comment-key:
    description: "A unique string used to find and update an existing comment instead of creating a new one"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Post or update PR comment
      uses: actions/github-script@v7
      env:
        COMMENT_MESSAGE: ${{ inputs.message }}
        COMMENT_KEY: ${{ inputs.comment-key }}
      with:
        script: |
          const message = process.env.COMMENT_MESSAGE;
          const commentKey = process.env.COMMENT_KEY;
          const pr = context.payload.pull_request;

          if (!pr) {
            core.warning('No pull_request payload found — skipping PR comment.');
            return;
          }

          const { owner, repo } = context.repo;
          const issue_number = pr.number;

          if (commentKey) {
            const marker = `<!-- comment-key: ${commentKey} -->`;
            const body = `${marker}\n${message}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body
              });
              console.log(`Updated comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
              console.log('Created new comment');
            }
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: message
            });
            console.log('Created new comment');
          }
