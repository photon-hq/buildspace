name: 'Go Build'
description: 'Build Go binary for a target platform'

inputs:
  binary-name:
    description: '[string] Output binary name'
    required: true
  go-version:
    description: '[string] Go version to use'
    required: false
    default: 'stable'
  goos:
    description: '[string] Target OS (e.g., darwin, linux, windows)'
    required: true
  goarch:
    description: '[string] Target architecture (e.g., amd64, arm64)'
    required: true
  build-flags:
    description: '[string] Additional go build flags (e.g., "-tags netgo")'
    required: false
    default: ''
  ldflags:
    description: '[string] Linker flags (e.g., "-s -w -X main.version=1.0.0")'
    required: false
    default: '-s -w'

outputs:
  artifact-name:
    description: 'Name of the artifact'
    value: ${{ steps.package.outputs.name }}
  artifact-path:
    description: 'Path to the built artifact'
    value: ${{ steps.package.outputs.path }}

runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}

    - name: Build
      id: build
      uses: $/.github/primitives/go-build
      with:
        output: ${{ inputs.binary-name }}${{ inputs.goos == 'windows' && '.exe' || '' }}
        goos: ${{ inputs.goos }}
        goarch: ${{ inputs.goarch }}
        build-flags: ${{ inputs.build-flags }}
        ldflags: ${{ inputs.ldflags }}

    - name: Package
      id: package
      uses: $/.github/primitives/stage-file
      with:
        source: ${{ steps.build.outputs.binary-path }}
        destination: artifacts/${{ inputs.binary-name }}-${{ inputs.goos }}-${{ inputs.goarch }}${{ inputs.goos == 'windows' && '.exe' || '' }}
        executable: 'true'
