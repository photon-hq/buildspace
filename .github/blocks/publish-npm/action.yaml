name: 'Publish to NPM'
description: 'Publish a package to NPM registry'

inputs:
  bun-version:
    description: '[string] Bun version to use'
    required: false
    default: 'latest'
  node-version:
    description: '[string] Node.js version'
    required: false
    default: '24'
  working-directory:
    description: '[string] Directory containing package.json'
    required: false
    default: '.'
  build-command:
    description: '[string] Build command'
    required: false
    default: 'bun run build'
  tag:
    description: "[string] NPM tag (e.g., 'latest', 'beta')"
    required: false
    default: 'latest'
  dry-run:
    description: "[boolean] Run in dry-run mode (no actual publishing)"
    required: false
    default: 'false'
  publish-command:
    description: "[string] Command used to publish (e.g., 'npm publish', 'bunx clean-publish'). The --registry, --tag, --access, and --dry-run flags are appended automatically."
    required: false
    default: 'npm publish'
  npm-token:
    description: 'NPM authentication token. Used only as a fallback when npm OIDC Trusted Publishing is unavailable or fails. Not required if OIDC Trusted Publishing is fully configured.'
    required: false

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://registry.npmjs.org
    - name: Upgrade npm for OIDC Trusted Publishing
      shell: bash
      run: npm install -g npm@latest
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install
    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: bash -euo pipefail -c "$BUILD_COMMAND"
    - name: Read package identity
      id: package
      uses: $/.github/primitives/npm-package-info
      with:
        working-directory: ${{ inputs.working-directory }}
    - name: Check OIDC availability
      id: oidc
      shell: bash
      run: |
        if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Publish via OIDC (npm Trusted Publishing)
      id: oidc-publish
      if: steps.oidc.outputs.available == 'true'
      continue-on-error: true
      uses: $/.github/primitives/npm-publish
      env:
        NODE_AUTH_TOKEN: ''
      with:
        working-directory: ${{ inputs.working-directory }}
        registry: https://registry.npmjs.org
        tag: ${{ inputs.tag }}
        access: public
        provenance: 'true'
        dry-run: ${{ inputs.dry-run }}
        command: ${{ inputs.publish-command }}
    - name: Reject a publisher that swallowed an OIDC error
      if: steps.oidc-publish.outcome == 'failure' && steps.oidc-publish.outputs.exit-code == '0'
      shell: bash
      run: |
        echo "::error::The OIDC publisher swallowed an npm error; refusing a token fallback"
        exit 1
    - name: Require fallback credentials
      if: steps.oidc-publish.outcome != 'success' && inputs.dry-run != 'true'
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
      run: |
        if [ -z "$NODE_AUTH_TOKEN" ]; then
          echo "::error::OIDC was unavailable or failed, and no npm token was provided"
          exit 1
        fi
    - name: Publish via NPM token (fallback)
      if: steps.oidc-publish.outcome != 'success'
      uses: $/.github/primitives/npm-publish
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
      with:
        working-directory: ${{ inputs.working-directory }}
        registry: https://registry.npmjs.org
        tag: ${{ inputs.tag }}
        access: public
        dry-run: ${{ inputs.dry-run }}
        command: ${{ inputs.publish-command }}
    - name: Verify publish landed on registry
      if: inputs.dry-run != 'true'
      uses: $/.github/primitives/wait-npm-version
      env:
        NODE_AUTH_TOKEN: ''
      with:
        package: ${{ steps.package.outputs.name }}
        version: ${{ steps.package.outputs.version }}
        registry: https://registry.npmjs.org
