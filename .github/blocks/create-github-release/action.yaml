name: 'Create GitHub Release'
description: 'Create a GitHub release with artifacts'

inputs:
  version:
    description: '[string] The version to release (e.g., 1.2.3)'
    required: true
  title:
    description: '[string] The release title'
    required: true
  notes:
    description: '[string] Release notes in markdown'
    required: false
    default: ''
  prerelease:
    description: "[boolean: 'true'/'false'] Whether this is a prerelease"
    required: false
    default: 'false'
  draft:
    description: "[boolean: 'true'/'false'] Whether to create as draft"
    required: false
    default: 'false'
  tag-prefix:
    description: '[string] Prefix for the git tag'
    required: false
    default: 'v'
  artifact-pattern:
    description: '[string] Pattern to match artifacts to attach (leave empty for none)'
    required: false
    default: ''
  app-id:
    description: '[secret] GitHub App ID for creating releases that trigger downstream workflows (optional)'
    required: false
    default: ''
  app-private-key:
    description: '[secret] GitHub App private key for creating releases that trigger downstream workflows (optional)'
    required: false
    default: ''

outputs:
  url:
    description: 'URL of the created release'
    value: ${{ steps.gh-release.outputs.url }}
  tag:
    description: 'The created tag name'
    value: ${{ inputs.tag-prefix }}${{ inputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Generate App Token
      id: app-token
      if: ${{ inputs.app-id != '' && inputs.app-private-key != '' }}
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}

    - name: Download artifacts
      if: inputs.artifact-pattern != ''
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: ${{ inputs.artifact-pattern }}
        merge-multiple: true

    - name: Create Release
      id: gh-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag-prefix }}${{ inputs.version }}
        name: ${{ inputs.title }}
        body: |
          ${{ inputs.notes }}

          ---
          **Version:** ${{ inputs.version }}
        draft: ${{ inputs.draft }}
        prerelease: ${{ inputs.prerelease }}
        files: ${{ inputs.artifact-pattern != '' && 'artifacts/*' || '' }}
        token: ${{ steps.app-token.outputs.token || github.token }}

