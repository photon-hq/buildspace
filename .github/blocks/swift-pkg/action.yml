name: "Swift Package"
description: "Build distribution package for Swift"

inputs:
  swift-binary-path:
    required: false
    description: "Path to your swift binary"
  identifier:
    required: true
    description: "Package identifier"
  version:
    required: true
    description: "Package version"
  package-name:
    required: true
    description: "Package name"
  developer-id-installer-name:
    required: false
    description: "Certificate name for signing (e.g., 'Developer ID Installer: Company (TEAMID)')"
  allow-unsigned:
    required: false
    default: "false"
    description: "Set to true to intentionally build an unsigned package"
  scripts-path:
    required: false
    description: "Path to scripts directory containing preinstall/postinstall scripts"
  payload-path:
    required: false
    description: "Path to additional payload directory whose contents mirror the install root (e.g. payload/Library/LaunchDaemons/…)"

runs:
  using: "composite"
  steps:
    - name: Prepare
      shell: bash
      run: |
        mkdir -p tmp/pkgroot
        mkdir -p artifacts
        if [ -n "${{ inputs.swift-binary-path }}" ]; then
          mkdir -p tmp/pkgroot/usr/local/bin
          cp ${{ inputs.swift-binary-path }} tmp/pkgroot/usr/local/bin
        fi

    - name: Copy additional payload
      if: ${{ inputs.payload-path != '' }}
      shell: bash
      run: cp -R ${{ inputs.payload-path }}/ tmp/pkgroot/

    - name: Create package
      shell: bash
      env:
        SIGN_IDENTITY: ${{ inputs.developer-id-installer-name }}
      run: |
        ARGS=(--root tmp/pkgroot
              --identifier "${{ inputs.identifier }}"
              --install-location /
              --version "${{ inputs.version }}")

        if [ -n "${{ inputs.scripts-path }}" ]; then
          ARGS+=(--scripts "${{ inputs.scripts-path }}")
        fi

        if [ -n "$SIGN_IDENTITY" ]; then
          ARGS+=(--sign "$SIGN_IDENTITY")
        elif [ "${{ inputs.allow-unsigned }}" != "true" ]; then
          echo "::error::developer-id-installer-name is required unless allow-unsigned=true"
          exit 1
        fi

        pkgbuild "${ARGS[@]}" "${{ inputs.package-name }}.pkg"

    - name: Prepare artifact
      shell: bash
      run: cp "${{ inputs.package-name }}.pkg" artifacts
