name: "Swift Package"
description: "Build distribution package for Swift"

inputs:
  swift-binary-path:
    required: false
    description: "Path to your swift binary"
  identifier:
    required: true
    description: "Package identifier"
  version:
    required: true
    description: "Package version"
  package-name:
    required: true
    description: "Package name"
  developer-id-installer-name:
    required: true
    description: "Certificate name (e.g., 'Developer ID Installer: Company (TEAMID)')"
  scripts-path:
    required: false
    description: "Path to scripts directory containing preinstall/postinstall scripts"
  payload-path:
    required: false
    description: "Path to additional payload directory whose contents mirror the install root (e.g. payload/Library/LaunchDaemons/…)"

runs:
  using: "composite"
  steps:
    - name: Prepare
      shell: bash
      run: |
        mkdir -p tmp/pkgroot
        mkdir -p artifacts
        if [ -n "${{ inputs.swift-binary-path }}" ]; then
          mkdir -p tmp/pkgroot/usr/local/bin
          cp ${{ inputs.swift-binary-path }} tmp/pkgroot/usr/local/bin
        fi

    - name: Copy additional payload
      if: ${{ inputs.payload-path != '' }}
      shell: bash
      run: cp -R ${{ inputs.payload-path }}/ tmp/pkgroot/

    - name: Create package
      shell: bash
      run: |
        SCRIPTS_ARG=""
        if [ -n "${{ inputs.scripts-path }}" ]; then
          SCRIPTS_ARG="--scripts ${{ inputs.scripts-path }}"
        fi
        pkgbuild --root tmp/pkgroot \
            --identifier ${{ inputs.identifier }} \
            --install-location / \
            --version ${{ inputs.version }} \
            $SCRIPTS_ARG \
            "${{ inputs.package-name }}.pkg"

    - name: Prepare artifact
      shell: bash
      run: cp "${{ inputs.package-name }}.pkg" artifacts
