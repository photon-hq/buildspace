name: "Swift Package"
description: "Build distribution package for Swift"

inputs:
  swift-binary-path:
    required: false
    description: "Path to your swift binary"
  identifier:
    required: true
    description: "Package identifier"
  version:
    required: true
    description: "Package version"
  package-name:
    required: true
    description: "Package name"
  developer-id-installer-name:
    required: false
    description: "Deprecated and ignored. Packages are always built unsigned."
  allow-unsigned:
    required: false
    default: "false"
    description: "Deprecated and ignored. Packages are always built unsigned."
  scripts-path:
    required: false
    description: "Path to scripts directory containing preinstall/postinstall scripts"
  payload-path:
    required: false
    description: "Path to additional payload directory whose contents mirror the install root (e.g. payload/Library/LaunchDaemons/…)"
  resource-bundles-path:
    required: false
    default: ""
    description: "Path to directory containing SPM resource bundles to install alongside the binary"

runs:
  using: "composite"
  steps:
    - name: Prepare
      shell: bash
      env:
        BINARY: ${{ inputs.swift-binary-path }}
      run: |
        mkdir -p tmp/pkgroot
        if [ -n "$BINARY" ]; then
          mkdir -p tmp/pkgroot/usr/local/bin
          cp "$BINARY" tmp/pkgroot/usr/local/bin
        fi

    - name: Copy additional payload
      if: ${{ inputs.payload-path != '' }}
      shell: bash
      env:
        PAYLOAD: ${{ inputs.payload-path }}
      run: cp -R "$PAYLOAD/" tmp/pkgroot/

    - name: Copy resource bundles
      if: ${{ inputs.resource-bundles-path != '' }}
      shell: bash
      env:
        RESOURCE_BUNDLES: ${{ inputs.resource-bundles-path }}
      run: |
        mkdir -p tmp/pkgroot/usr/local/bin
        cp -R "$RESOURCE_BUNDLES"/*.bundle tmp/pkgroot/usr/local/bin/
        echo "Resource bundles installed to /usr/local/bin/:"
        ls -d tmp/pkgroot/usr/local/bin/*.bundle

    - name: Create package
      uses: $/.github/primitives/pkgbuild
      with:
        root: tmp/pkgroot
        identifier: ${{ inputs.identifier }}
        version: ${{ inputs.version }}
        scripts: ${{ inputs.scripts-path }}
        output: ${{ inputs.package-name }}.pkg

    - name: Prepare artifact
      uses: $/.github/primitives/stage-file
      with:
        source: ${{ inputs.package-name }}.pkg
        destination: artifacts/${{ inputs.package-name }}.pkg
