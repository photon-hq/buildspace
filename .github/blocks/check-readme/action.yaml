name: 'Check README'
description: 'Use AI to check if the README is up to date with the changes in a PR'

inputs:
  openai-api-key:
    description: '[secret] OpenAI API key for AI-powered README analysis'
    required: true

outputs:
  up-to-date:
    description: "[boolean: 'true'/'false'] Whether the README appears up to date with the PR changes"
    value: ${{ steps.parse.outputs.up-to-date }}
  explanation:
    description: '[string] AI explanation of why the README may or may not need updating'
    value: ${{ steps.parse.outputs.explanation }}

runs:
  using: 'composite'
  steps:
    - name: Get changed files
      id: changed-files
      uses: actions/github-script@v7
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          const files = await github.paginate(github.rest.pulls.listFiles, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
            per_page: 100
          });

          if (!Number.isInteger(pr.changed_files) || pr.changed_files < 0 ||
              pr.changed_files > 3000 || files.length !== pr.changed_files ||
              files.some(file => typeof file.filename !== 'string' || !file.filename)) {
            throw new Error('Cannot assess README: the PR file list is incomplete or invalid.');
          }
          core.setOutput('files', files.map(f => f.filename).join('\n'));

    - name: AI Check README
      id: ai-check
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        model: gpt-5.4
        safety-strategy: read-only
        prompt: |
          You are reviewing a pull request to determine if the README (README.md) is up to date.

          The following files were changed in this PR:
          ${{ steps.changed-files.outputs.files }}

          Read the README at "README.md" and skim the changed files to understand the nature of the changes.

          Determine whether the README accurately reflects the current state of the codebase
          after these changes. Even if the README was modified in this PR, verify the updates
          are sufficient. Consider:
          - New or removed features, commands, APIs, or configuration options
          - Changed installation steps, dependencies, or setup instructions
          - Renamed or restructured modules that the README references
          - New environment variables or changed defaults

          Do NOT flag the README as needing an update for:
          - Internal refactors that don't change public behavior
          - Test-only changes
          - CI/CD or build config tweaks
          - Bug fixes that don't alter documented behavior
          - Minor code style or formatting changes

          Choose exactly one verdict: UP_TO_DATE or NEEDS_UPDATE.
          Respond in EXACTLY this format (two lines, nothing else):
          VERDICT: <chosen verdict>
          REASON: <one sentence explanation>

    - name: Parse AI output
      id: parse
      uses: actions/github-script@v7
      env:
        RAW_OUTPUT: ${{ steps.ai-check.outputs.final-message }}
      with:
        script: |
          const output = (process.env.RAW_OUTPUT || '').replace(/\r\n/g, '\n').trim();
          const result = /^VERDICT: (UP_TO_DATE|NEEDS_UPDATE)\nREASON: ([^\r\n]+)$/.exec(output);
          if (!result || !result[2].trim()) {
            core.setFailed('README status is unknown: expected a verdict and a nonempty reason. Existing warnings are retained.');
            return;
          }
          core.setOutput('up-to-date', String(result[1] === 'UP_TO_DATE'));
          core.setOutput('explanation', result[2].trim());
