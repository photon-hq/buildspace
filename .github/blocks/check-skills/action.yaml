name: 'Check Skills'
description: 'Use AI to check if the skills documentation is up to date with the changes in a PR'

inputs:
  openai-api-key:
    description: '[secret] OpenAI API key for AI-powered skills analysis'
    required: true
  github-token:
    description: '[secret] GitHub token for checking out the skills repository (use a PAT if the skills repo is private)'
    required: true
  skills-repo:
    description: 'The skills repository to check against (owner/repo format)'
    required: false
    default: 'photon-hq/skills'

outputs:
  needs-update:
    description: "[boolean: 'true'/'false'] Whether the skills documentation appears to need updating based on the PR changes"
    value: ${{ steps.parse.outputs.needs-update }}
  explanation:
    description: '[string] AI explanation of why the skills may or may not need updating'
    value: ${{ steps.parse.outputs.explanation }}

runs:
  using: 'composite'
  steps:
    - name: Get changed files
      id: changed-files
      uses: actions/github-script@v7
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          const files = await github.paginate(github.rest.pulls.listFiles, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
            per_page: 100
          });

          if (!Number.isInteger(pr.changed_files) || pr.changed_files < 0 ||
              pr.changed_files > 3000 || files.length !== pr.changed_files ||
              files.some(file => typeof file.filename !== 'string' || !file.filename)) {
            throw new Error('Cannot assess skills: the PR file list is incomplete or invalid.');
          }
          core.setOutput('files', files.map(f => f.filename).join('\n'));

    - name: Checkout skills repository
      uses: actions/checkout@v5
      with:
        repository: ${{ inputs.skills-repo }}
        token: ${{ inputs.github-token }}
        path: _skills-repo

    - name: AI Check Skills
      id: ai-check
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        model: gpt-5.4
        safety-strategy: read-only
        prompt: |
          You are reviewing a pull request to determine if the agent skills documentation needs updating.

          The skills documentation lives in `_skills-repo/skills/` — each subdirectory contains a `SKILL.md`
          file describing how an AI agent should use a particular SDK or service.

          The following files were changed in this PR:
          ${{ steps.changed-files.outputs.files }}

          Read the changed files to understand the nature of the changes, then read the relevant SKILL.md
          files in `_skills-repo/skills/` to understand what is currently documented.

          Determine whether the skills documentation accurately reflects the state of the codebase after
          these changes. Consider:
          - New features, APIs, methods, or configuration options that agents need to know about
          - Changed behavior, signatures, or semantics of documented functionality
          - Removed features or methods that are still referenced in the skills
          - New packages or installation steps an agent would need to use the SDK

          Do NOT flag skills as needing an update for:
          - Internal refactors that don't change public-facing behavior
          - Test-only changes
          - CI/CD or build config tweaks
          - Bug fixes that don't alter documented behavior
          - Minor code style or formatting changes
          - Changes entirely unrelated to any SDK or service described in the skills

          If this PR is entirely irrelevant to the skills documentation (e.g., it only touches CI config,
          internal tooling, or infrastructure), respond with VERDICT: IRRELEVANT.

          Choose exactly one verdict: IRRELEVANT, UP_TO_DATE, or NEEDS_UPDATE.
          Respond in EXACTLY this format (two lines, nothing else):
          VERDICT: <chosen verdict>
          REASON: <one sentence explanation>

    - name: Parse AI output
      id: parse
      uses: actions/github-script@v7
      env:
        RAW_OUTPUT: ${{ steps.ai-check.outputs.final-message }}
      with:
        script: |
          const output = (process.env.RAW_OUTPUT || '').replace(/\r\n/g, '\n').trim();
          const result = /^VERDICT: (IRRELEVANT|UP_TO_DATE|NEEDS_UPDATE)\nREASON: ([^\r\n]+)$/.exec(output);
          if (!result || !result[2].trim()) {
            core.setFailed('Skills status is unknown: expected a verdict and a nonempty reason. Existing warnings are retained.');
            return;
          }
          core.setOutput('needs-update', String(result[1] === 'NEEDS_UPDATE'));
          core.setOutput('explanation', result[2].trim());
