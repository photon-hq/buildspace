name: 'Publish to GitHub Packages'
description: 'Build and publish a single npm package to the GitHub Packages registry'

inputs:
  bun-version:
    description: '[string] Bun version to use'
    required: false
    default: 'latest'
  node-version:
    description: '[string] Node.js version'
    required: false
    default: '24'
  working-directory:
    description: '[string] Directory containing package.json'
    required: false
    default: '.'
  build-command:
    description: '[string] Build command'
    required: false
    default: 'bun run build'
  tag:
    description: "[string] Package tag (e.g., 'latest', 'beta')"
    required: false
    default: 'latest'
  dry-run:
    description: '[boolean] Run in dry-run mode (no actual publishing)'
    required: false
    default: 'false'
  publish-command:
    description: "[string] Command used to publish (e.g., 'npm publish', 'bunx clean-publish'). The --registry, --tag, and --dry-run flags are appended automatically."
    required: false
    default: 'npm publish'
  github-token:
    description: '[secret] GitHub token with packages: write for the repository that owns the package'
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
    - name: Authenticate to GitHub Packages
      shell: bash
      env:
        GITHUB_PACKAGES_TOKEN: ${{ inputs.github-token }}
      run: printf '//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_PACKAGES_TOKEN" >> "$HOME/.npmrc"
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bun install
    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: bash -euo pipefail -c "$BUILD_COMMAND"
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://npm.pkg.github.com
        scope: ${{ format('@{0}', github.repository_owner) }}
    - name: Read package identity
      id: package
      uses: $/.github/primitives/npm-package-info
      with:
        working-directory: ${{ inputs.working-directory }}
    - name: Require the repository owner's package scope and credentials
      shell: bash
      env:
        PACKAGE_NAME: ${{ steps.package.outputs.name }}
        PACKAGE_OWNER: ${{ github.repository_owner }}
        NODE_AUTH_TOKEN: ${{ inputs.github-token }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        NAME_LOWER="$(printf '%s' "$PACKAGE_NAME" | tr '[:upper:]' '[:lower:]')"
        PREFIX="$(printf '@%s/' "$PACKAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
        case "$NAME_LOWER" in
          "$PREFIX"*) ;;
          *) echo "::error::GitHub Packages requires the repository owner's scope: $PREFIX"; exit 1 ;;
        esac
        if [ "$DRY_RUN" != "true" ] && [ -z "$NODE_AUTH_TOKEN" ]; then
          echo "::error::No GitHub Packages token was provided"
          exit 1
        fi
    - name: Publish to GitHub Packages
      uses: $/.github/primitives/npm-publish
      env:
        NODE_AUTH_TOKEN: ${{ inputs.github-token }}
      with:
        working-directory: ${{ inputs.working-directory }}
        registry: https://npm.pkg.github.com
        tag: ${{ inputs.tag }}
        dry-run: ${{ inputs.dry-run }}
        command: ${{ inputs.publish-command }}
    - name: Verify publish landed on registry
      if: inputs.dry-run != 'true'
      uses: $/.github/primitives/wait-npm-version
      env:
        NODE_AUTH_TOKEN: ${{ inputs.github-token }}
      with:
        package: ${{ steps.package.outputs.name }}
        version: ${{ steps.package.outputs.version }}
        registry: https://npm.pkg.github.com
