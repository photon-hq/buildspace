name: "Build Makefile dylib"
description: "Build dynamic library from Makefile"

inputs:
  output-name:
    required: true
    description: "Name of the output dylib (e.g., imessage-helper)"
  version:
    required: false
    default: ''
    description: "Version to embed (passed as VERSION= to make)"
  extra-artifacts:
    required: false
    default: ''
    description: "Newline-separated list of additional build outputs (paths relative to repo root) to attach to the release. Each path is copied into artifacts/ alongside the dylib."

runs:
  using: "composite"
  steps:
    - name: Build dylib
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        make ${VERSION:+VERSION=$VERSION} release

        DYLIB="build/${{ inputs.output-name }}.dylib"

        if [ -f "$DYLIB" ]; then
          echo "${{ inputs.output-name }}.dylib built successfully"
          file "$DYLIB"
        else
          echo "::error::${{ inputs.output-name }}.dylib not found — build failure"
          exit 1
        fi

    - name: Prepare artifact
      shell: bash
      env:
        EXTRA_ARTIFACTS: ${{ inputs.extra-artifacts }}
      run: |
        mkdir -p artifacts
        cp "build/${{ inputs.output-name }}.dylib" artifacts/

        if [ -n "$EXTRA_ARTIFACTS" ]; then
          while IFS= read -r raw; do
            # strip leading/trailing whitespace
            extra="${raw#"${raw%%[![:space:]]*}"}"
            extra="${extra%"${extra##*[![:space:]]}"}"

            # skip blank lines and comments
            if [ -z "$extra" ] || [ "${extra#\#}" != "$extra" ]; then
              continue
            fi

            if [ ! -f "$extra" ]; then
              echo "::error::extra artifact '$extra' not found — build failure"
              exit 1
            fi

            echo "Including extra artifact: $extra"
            file "$extra"
            cp "$extra" artifacts/
          done <<< "$EXTRA_ARTIFACTS"
        fi
