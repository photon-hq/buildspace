name: "Build Makefile dylib"
description: "Build dynamic library from Makefile"

inputs:
  output-name:
    required: true
    description: "Name of the output dylib (e.g., imessage-helper)"
  version:
    required: false
    default: ''
    description: "Version to embed (passed as VERSION= to make)"

runs:
  using: "composite"
  steps:
    - name: Build dylib
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        OUTPUT_NAME: ${{ inputs.output-name }}
      run: |
        make ${VERSION:+VERSION=$VERSION} release

        DYLIB="build/$OUTPUT_NAME.dylib"

        if [ -f "$DYLIB" ]; then
          echo "$OUTPUT_NAME.dylib built successfully"
          file "$DYLIB"
        else
          echo "::error::$OUTPUT_NAME.dylib not found — build failure"
          exit 1
        fi

    - name: Prepare artifact
      uses: $/.github/primitives/stage-file
      with:
        source: build/${{ inputs.output-name }}.dylib
        destination: artifacts/${{ inputs.output-name }}.dylib
