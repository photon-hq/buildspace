name: Wait for npm version
description: Read a registry until an exact package version is visible; never publishes or changes a distribution tag
inputs:
  package:
    description: Package name
    required: true
  version:
    description: Exact version to find
    required: true
  registry:
    description: npm-compatible registry URL
    required: true
  attempts:
    description: Maximum registry reads when timeout-seconds is empty
    default: '6'
  interval-seconds:
    description: Delay between registry reads; with timeout-seconds, the first delay, which then doubles up to 30 seconds
    default: '5'
  timeout-seconds:
    description: Seconds to keep reading, replacing attempts; empty keeps the fixed attempts schedule
    default: ''
  dist-tag:
    description: Distribution tag that must name the version; empty skips the check
    default: ''
  integrity:
    description: Expected dist.integrity of the version; a different value fails at once; empty skips the check
    default: ''
outputs:
  version:
    description: Verified version
runs:
  using: node24
  main: index.mjs
