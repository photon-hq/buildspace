name: Build Swift binary
description: Compile one release product with an already installed Swift toolchain
inputs:
  product:
    description: Executable product name
    required: true
  working-directory:
    description: Swift package directory
    default: '.'
  build-flags:
    description: Extra swift build arguments, split on whitespace and never run through a shell (e.g. -Xswiftc -Onone)
    default: ''
outputs:
  binary-path:
    description: Absolute path to the executable, before signing or staging
runs:
  using: node24
  main: index.mjs
