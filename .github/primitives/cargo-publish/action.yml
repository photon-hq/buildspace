name: Publish Cargo crate
description: Publish one prepared crate with an already installed Cargo toolchain
inputs:
  package:
    description: Workspace package to select; empty uses Cargo's default selection
    default: ''
  working-directory:
    description: Directory from which to publish
    default: '.'
  dry-run:
    description: Validate publication without writing to the registry
    default: 'false'
  allow-dirty:
    description: Allow uncommitted source changes
    default: 'false'
runs:
  using: node24
  main: index.mjs
